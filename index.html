<!doctype html><html lang="ko" class="tq-booting"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><meta name="color-scheme" content="dark"><meta name="description" content="MALBIT · Korean learning through TOPIK practice, Shorts review, and a dice expedition game."><link rel="preload" href="assets/art/malbit-home-hero.webp" as="image" type="image/webp" fetchpriority="high"><link rel="manifest" href="manifest.webmanifest?v=39"><link rel="icon" href="icon.svg?v=39" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg?v=39"><title>MALBIT · Korean Learning</title><link rel="stylesheet" href="styles.css?v=39"></head><body><div class="app"><header class="top"><div class="toprow"><div class="brand">MB</div><div class="title"><b>MALBIT · 말빛</b><small>TOPIK I·II PREP · GAME · SHORTS · 4 LANG</small></div><button id="flagBtn" class="flagBtn" onclick="flagMenu()">🇰🇷</button></div><div class="progress"><i id="progressBar"></i></div></header><main id="screen" class="screen"></main></div><div id="flagMenu" class="flagMenu"><button class="flagOpt" data-lang="ko" onclick="setLang('ko')"><span class="flag">🇰🇷</span>한국어</button><button class="flagOpt" data-lang="ja" onclick="setLang('ja')"><span class="flag">🇯🇵</span>日本語</button><button class="flagOpt" data-lang="en" onclick="setLang('en')"><span class="flag">🇺🇸</span>English</button><button class="flagOpt" data-lang="zh" onclick="setLang('zh')"><span class="flag">🇨🇳</span>中文</button></div><div id="overlay" class="overlay"><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div><div id="resultCurtain" class="resultCurtain"><div id="drum" class="drum"><div class="dots">🥁🥁🥁</div><h2>두구두구두구...</h2></div><div id="resultCard" class="resultCard"></div></div><div id="selectionBar" class="selectionBar"><div id="selectionWord" class="selectionWord"></div><button onclick="addVocab()">＋ 단어장</button></div><div id="toast" class="toast"></div><div class="bottom"><nav class="nav"><button id="nav_home" onclick="setView('home')"><b>⌂</b><span>홈</span></button><button id="nav_review" onclick="setView('review')"><b>↻</b><span>복습</span></button><button id="nav_speaking" onclick="setView('speaking')"><b>🎙</b><span>말하기</span></button><button id="nav_vocab" onclick="setView('vocab')"><b>▣</b><span>단어장</span></button><button id="nav_more" onclick="setView('more')"><b>•••</b><span>더보기</span></button></nav></div><script src="legacy-data.js?v=39"></script><script src="legacy-core.js?v=39"></script><script>{
(function(){
  const root=document.documentElement;
  const appVersion='39';
  const swReloadKey=`malbitSwReloadV${appVersion}`;
  let swUpdatePending=false,queuedReady=false,swReleaseTimer=null;
  const showRecovery=()=>{
    if(document.getElementById('malbitBootRecovery'))return;
    const note=document.createElement('div');
    note.id='malbitBootRecovery';note.setAttribute('role','status');note.setAttribute('aria-live','polite');
    note.textContent=typeof ml==='function'?ml('앱을 복구했습니다. 학습 기록은 그대로 유지됩니다.','アプリを復旧しました。学習記録は保持されています。','MALBIT recovered. Your progress is safe.','应用已恢复，学习记录已保留。'):'MALBIT recovered. Your progress is safe.';
    note.style.cssText='position:fixed;z-index:1200;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:11px 15px;border:1px solid #355276;border-radius:14px;background:#10233dcc;color:#eaf3ff;font:800 11px/1.35 system-ui,sans-serif;text-align:center;box-shadow:0 12px 32px #0008;backdrop-filter:blur(12px)';
    document.body.appendChild(note);setTimeout(()=>note.remove(),4500);
  };
  const reveal=reason=>{
    if(reason==='ready'&&swUpdatePending){queuedReady=true;return}
    clearTimeout(watchdog);
    if(reason!=='ready'){
      try{if(typeof render==='function')render()}catch(error){
        console.error('[MALBIT recovery]',error);
        try{if(typeof S==='object'){S.view='home';save();render()}}catch(ignore){}
      }
    }
    root.classList.remove('tq-booting');
    if(reason!=='ready')showRecovery();
  };
  const releaseSwUpdate=()=>{
    if(!swUpdatePending)return;swUpdatePending=false;clearTimeout(swReleaseTimer);
    if(queuedReady){queuedReady=false;reveal('ready')}
  };
  const watchdog=setTimeout(()=>reveal('watchdog'),18000);
  window.__malbitBoot={finish:reveal};
  if('serviceWorker'in navigator&&location.protocol!=='file:'){
    const registerWorker=()=>navigator.serviceWorker.register(`./sw.js?v=${appVersion}`,{updateViaCache:'none'});
    if(!navigator.serviceWorker.controller){
      const install=()=>registerWorker().catch(()=>{});
      document.readyState==='complete'?install():window.addEventListener('load',install,{once:true});
    }else if(sessionStorage.getItem(swReloadKey)!=='1'){
      swUpdatePending=true;swReleaseTimer=setTimeout(releaseSwUpdate,15000);
      navigator.serviceWorker.addEventListener('controllerchange',()=>{sessionStorage.setItem(swReloadKey,'1');location.reload()},{once:true});
      registerWorker().then(reg=>reg.update().then(()=>reg)).then(reg=>{
        if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
        if(!reg.installing&&!reg.waiting){sessionStorage.setItem(swReloadKey,'1');releaseSwUpdate()}
      }).catch(releaseSwUpdate);
    }
  }
  const x=document.createElement('script');x.src=`site-patch.js?v=${appVersion}`;x.async=false;x.onerror=()=>reveal('bootstrap-error');document.body.appendChild(x);
})();
}</script></body></html>
