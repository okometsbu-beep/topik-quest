</style></head><body><div class="app"><header class="top"><div class="toprow"><div class="brand">MB</div><div class="title"><b>MALBIT · 말빛</b><small>TOPIK I·II PREP · GAME · SHORTS · 4 LANG</small></div><button id="flagBtn" class="flagBtn" onclick="flagMenu()">🇰🇷</button></div><div class="progress"><i id="progressBar"></i></div></header><main id="screen" class="screen"></main></div><div id="flagMenu" class="flagMenu"><button class="flagOpt" data-lang="ko" onclick="setLang('ko')"><span class="flag">🇰🇷</span>한국어</button><button class="flagOpt" data-lang="ja" onclick="setLang('ja')"><span class="flag">🇯🇵</span>日本語</button><button class="flagOpt" data-lang="en" onclick="setLang('en')"><span class="flag">🇺🇸</span>English</button><button class="flagOpt" data-lang="zh" onclick="setLang('zh')"><span class="flag">🇨🇳</span>中文</button></div><div id="overlay" class="overlay"><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div><div id="resultCurtain" class="resultCurtain"><div id="drum" class="drum"><div class="dots">🥁🥁🥁</div><h2>두구두구두구...</h2></div><div id="resultCard" class="resultCard"></div></div><div id="selectionBar" class="selectionBar"><div id="selectionWord" class="selectionWord"></div><button onclick="addVocab()">＋ 단어장</button></div><div id="toast" class="toast"></div><div class="bottom"><nav class="nav"><button id="nav_home" onclick="setView('home')"><b>⌂</b><span>홈</span></button><button id="nav_review" onclick="setView('review')"><b>↻</b><span>복습</span></button><button id="nav_speaking" onclick="setView('speaking')"><b>🎙</b><span>말하기</span></button><button id="nav_vocab" onclick="setView('vocab')"><b>▣</b><span>단어장</span></button><button id="nav_more" onclick="setView('more')"><b>•••</b><span>더보기</span></button></nav></div><script>const RW=[{"id":1,"stem":"효율적으로 업무를 처리하려면 우선 해야 할 일을 순서대로 (          ).","choices":["① 정리해 두는 편이다","② 정리해 놓아야 한다","③ 정리한 적이 있다","④ 정리하는 중이다"],"answer":"②","translation":"仕事を効率よく処理するには、まずやるべきことを順番に整理しておかなければならない。","grammar":"-(으)려면『～しようとするなら／～するには』＋ -아/어야 하다『～しなければならない』。条件と必要条件の組み合わせ。","vocab":"효율적으로=効率的に / 우선=まず / 순서대로=順番に","why":"①は普段の傾向、③は経験、④は進行中を表し、文脈上『必要条件』にならない。","answerIndex":1,"categoryKo":"문법 빈칸","categoryJa":"文法穴埋め","section":"reading"},{"id":2,"stem":"새로운 기술은 처음에는 낯설지만 계속 사용하다 보면 어느새 익숙해지기 (          ).","choices":["① 마련이다","② 바람이다","③ 나름이다","④ 탓이다"],"answer":"①","translation":"新しい技術は最初は不慣れでも、使い続けているうちにいつの間にか慣れるものだ。","grammar":"-기 마련이다『当然～するものだ／～するのが普通だ』。一般的な傾向や必然性を表す。","vocab":"낯설다=不慣れだ / 어느새=いつの間にか / 익숙해지다=慣れる","why":"②바람이다は『願い』、③나름이다は『～次第だ』、④탓이다は悪い原因を表す。","answerIndex":0,"categoryKo":"문법 빈칸","categoryJa":"文法穴埋め","section":"reading"},{"id":3,"stem":"회의가 길어지는 바람에 약속 시간에 늦었다.\n\n‘회의가 길어지는 바람에’와 의미가 가장 비슷한 것을 고르십시오.","choices":["① 회의가 길어진 덕분에","② 회의가 길어진 탓에","③ 회의가 길어지는 김에","④ 회의가 길어질 뿐 아니라"],"answer":"②","translation":"会議が長引いたせいで、約束の時間に遅れた。","grammar":"-는 바람에『～したせいで』。予想外の原因によって好ましくない結果が起きる時によく使う。『-는 탓에』と近い。","vocab":"길어지다=長引く / 약속 시간=約束の時間 / 늦다=遅れる","why":"덕분에は通常よい結果、김에は『ついでに』、뿐 아니라は『～だけでなく』。","answerIndex":1,"categoryKo":"유사 표현","categoryJa":"類義表現","section":"reading"},{"id":4,"stem":"같은 자료라도 어떻게 설명하느냐에 따라 이해하기 쉬울 수도 어려울 수도 있다.\n\n‘어떻게 설명하느냐에 따라’와 의미가 가장 비슷한 것을 고르십시오.","choices":["① 설명하는 데 비해","② 설명하기 나름이라서","③ 설명할 정도로","④ 설명하는 대신"],"answer":"②","translation":"同じ資料でも、どのように説明するかによって理解しやすくも難しくもなり得る。","grammar":"-느냐에 따라『～するかによって』。結果が条件・方法に左右される。『-기 나름이다』＝『～次第だ』と意味が近い。","vocab":"자료=資料 / 이해하다=理解する / 나름=次第","why":"①は比較、③は程度、④は代替を表す。","answerIndex":1,"categoryKo":"유사 표현","categoryJa":"類義表現","section":"reading"},{"id":5,"stem":"[한 권의 책, 한 달의 변화]\n읽고 싶은 책을 골라 4주 동안 함께 읽습니다.\n매주 토요일 오전 10시 / 시립도서관","choices":["① 독서 모임","② 운동 수업","③ 취업 상담","④ 여행 상품"],"answer":"①","translation":"『1冊の本、1か月の変化』読みたい本を選び、4週間一緒に読みます。毎週土曜午前10時、市立図書館。","grammar":"광고·안내문에서는 장소·행동·목적을 빠르게 연결하는 것이 핵심。","vocab":"한 권=1冊 / 함께 읽다=一緒に読む / 시립도서관=市立図書館","why":"『本を選んで一緒に読む』ため、読書会が最も自然。","answerIndex":0,"categoryKo":"광고·안내","categoryJa":"広告・案内","section":"reading"},{"id":6,"stem":"[깨끗하게, 필요한 만큼만!]\n셔츠 3벌 이상 맡기면 20% 할인\n수요일은 이불 세탁 할인","choices":["① 음식점","② 세탁소","③ 사진관","④ 문구점"],"answer":"②","translation":"『きれいに、必要な分だけ！』シャツ3着以上を預けると20％割引。水曜日は布団クリーニング割引。","grammar":"무엇에 대한 광고인지 묻는 유형은 핵심 명사(세탁, 맡기다, 이불)를 잡는다。","vocab":"벌=着（衣類の助数詞）/ 맡기다=預ける / 이불=布団 / 세탁=洗濯","why":"衣類を預けて洗濯するサービスなので세탁소。","answerIndex":1,"categoryKo":"광고·안내","categoryJa":"広告・案内","section":"reading"},{"id":7,"stem":"[오늘 주문하면 내일 아침 문 앞에]\n지역 농가에서 수확한 채소를 주 1회 배송합니다.\n원하는 구성으로 매주 변경 가능","choices":["① 채소 정기 배송","② 농기구 대여","③ 요리 강좌","④ 식당 예약"],"answer":"①","translation":"『今日注文すれば明朝玄関前へ』地域農家で収穫した野菜を週1回配送。内容は毎週変更可能。","grammar":"-면『～すれば』、주 1회『週1回』。","vocab":"농가=農家 / 수확하다=収穫する / 배송하다=配送する / 구성=構成・セット内容","why":"定期的に野菜を配送するサービスを説明している。","answerIndex":0,"categoryKo":"광고·안내","categoryJa":"広告・案内","section":"reading"},{"id":8,"stem":"[고장 난 우산, 버리지 마세요!]\n손잡이·살대 교체 / 매주 목요일 무료 수리\n주민센터 앞 작은 작업실","choices":["① 재활용 교육","② 우산 수리 행사","③ 중고 판매","④ 분실물 안내"],"answer":"②","translation":"『壊れた傘、捨てないで！』持ち手・骨の交換、毎週木曜無料修理。住民センター前の小さな作業室。","grammar":"-지 마세요『～しないでください』。","vocab":"고장 나다=壊れる / 살대=傘の骨 / 교체=交換 / 수리=修理","why":"無料修理の案内なので『傘の修理イベント』。","answerIndex":1,"categoryKo":"광고·안내","categoryJa":"広告・案内","section":"reading"},{"id":9,"stem":"시립도서관 자료실 바닥 공사 안내\n8월 20일 18시부터 8월 21일까지 자료실을 이용할 수 없습니다.\n책 반납은 정문 옆 무인 반납함을 이용해 주십시오.\n열람실은 정상 운영합니다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 8월 21일에는 도서관 전체가 문을 닫는다.","② 공사 기간에는 책을 반납할 수 없다.","③ 공사 기간에도 열람실은 이용할 수 있다.","④ 바닥 공사는 8월 20일 아침부터 시작된다."],"answer":"③","translation":"市立図書館の資料室は工事で利用不可だが、閲覧室は通常どおり利用でき、返却ボックスも使える。","grammar":"-을 수 없다『～できない』/ 정상 운영하다『通常運営する』。","vocab":"자료실=資料室 / 반납함=返却ボックス / 열람실=閲覧室","why":"本文に『열람실은 정상 운영합니다』と明記されている。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":10,"stem":"공공 자전거 1일권 이용 안내\n회원 가입 없이 교통카드로 1일권을 구입할 수 있습니다.\n대여 후 2시간 이내에 반납하면 추가 요금이 없습니다.\n어느 대여소에서든 반납할 수 있습니다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 1일권을 사려면 회원 가입을 해야 한다.","② 자전거는 두 시간만 빌릴 수 있다.","③ 빌린 대여소에만 자전거를 반납해야 한다.","④ 교통카드로 1일권을 살 수 있다."],"answer":"④","translation":"公共自転車の1日券は会員登録なしで交通カードで購入でき、どの貸出所でも返却できる。","grammar":"-없이『～なしで』/ -든『どの～でも』。","vocab":"대여=貸出 / 반납=返却 / 추가 요금=追加料金","why":"④が本文と一致。②は『2時間以内なら追加料金なし』であり、2時間しか借りられないとは書いていない。","answerIndex":3,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":11,"stem":"청년 영상 공모전\n주제: 우리 동네의 숨은 매력\n영상 길이: 1~3분 / 스마트폰 촬영 가능\n접수: 9월 15일까지\n개인 또는 4명 이하의 팀으로 참가 가능\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 영상은 반드시 전문 카메라로 찍어야 한다.","② 영상 길이는 최소 5분이어야 한다.","③ 네 명이 한 팀으로 참가할 수 있다.","④ 접수는 9월 15일부터 시작한다."],"answer":"③","translation":"青年映像コンテスト。1～3分、スマートフォン撮影可、9月15日まで、個人または4人以下のチームで参加可能。","grammar":"-아/어도 되다に近い『가능』の表現。이하=以下。","vocab":"공모전=コンテスト / 숨은 매력=隠れた魅力 / 접수=受付","why":"『4명 이하의 팀』なので4人チームは可能。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":12,"stem":"박물관 야간 관람 안내\n매월 마지막 수요일은 밤 9시까지 문을 엽니다.\n만 24세 이하 관람객은 오후 6시 이후 특별전을 무료로 볼 수 있습니다.\n단, 특별전은 홈페이지에서 미리 예약해야 합니다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 박물관은 매주 수요일 밤 9시까지 연다.","② 특별전은 예약하지 않아도 볼 수 있다.","③ 24세 이하 관람객은 오후 6시 이후 예약하면 특별전을 무료로 볼 수 있다.","④ 모든 관람객은 오후 6시 이후 무료로 입장할 수 있다."],"answer":"③","translation":"博物館は毎月最終水曜に夜間開館。24歳以下は18時以降、事前予約すれば特別展を無料で見られる。","grammar":"단『ただし』は条件・例外を付け加える重要な談話標識。","vocab":"야간 관람=夜間観覧 / 특별전=特別展 / 미리=あらかじめ","why":"年齢・時間・予約の3条件をすべて満たす③が正解。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":13,"stem":"다음 문장을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 이 때문에 도시에서도 작은 텃밭을 가꾸려는 사람이 늘고 있다.\n(나) 직접 기른 채소를 먹는 즐거움뿐 아니라 스트레스 해소에도 도움이 되기 때문이다.\n(다) 최근 아파트 베란다나 옥상처럼 작은 공간을 활용하는 도시 농업이 주목받고 있다.\n(라) 이에 따라 지자체에서도 관련 교육과 텃밭 공간을 제공하고 있다.","choices":["① (다)-(가)-(나)-(라)","② (다)-(나)-(가)-(라)","③ (가)-(나)-(다)-(라)","④ (나)-(다)-(라)-(가)"],"answer":"①","translation":"最近、ベランダや屋上を活用する都市農業が注目されている。→そのため都市で家庭菜園をする人が増加。→理由は楽しさとストレス解消。→自治体も支援。","grammar":"이 때문에=そのため / -기 때문이다=～からだ / 이에 따라=これに伴い。接続表現で順序を判断。","vocab":"텃밭=家庭菜園 / 가꾸다=育てる・手入れする / 지자체=自治体","why":"『최근…주목』が導入、이 때문에→その原因を受ける、때문이다→理由説明、이에 따라→社会的対応。","answerIndex":0,"categoryKo":"문장 배열","categoryJa":"文の並べ替え","section":"reading"},{"id":14,"stem":"다음 문장을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 그러나 모든 업무를 온라인으로 처리하기 어려운 경우도 있다.\n(나) 원격 근무는 이동 시간을 줄이고 업무 장소를 자유롭게 선택할 수 있다는 장점이 있다.\n(다) 따라서 업무 성격에 따라 출근과 원격 근무를 적절히 섞는 방식이 필요하다.\n(라) 특히 즉각적인 협업이나 장비 사용이 필요한 업무에서는 한계가 나타난다.","choices":["① (가)-(라)-(나)-(다)","② (나)-(가)-(라)-(다)","③ (나)-(라)-(가)-(다)","④ (라)-(나)-(다)-(가)"],"answer":"②","translation":"リモート勤務の長所提示→しかし全業務で可能ではない→特に即時協働や設備利用に限界→したがって出社とリモートの併用が必要。","grammar":"그러나=しかし / 특히=特に / 따라서=したがって。","vocab":"원격 근무=リモート勤務 / 협업=協働 / 적절히=適切に","why":"接続語だけでも論理の骨格が見える。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"文の並べ替え","section":"reading"},{"id":15,"stem":"다음 문장을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 복원 과정에서는 원래 재료와 제작 방식에 대한 조사부터 이루어진다.\n(나) 문화재 복원은 낡은 부분을 단순히 새것으로 바꾸는 작업이 아니다.\n(다) 그래야 문화재가 가진 역사적 가치와 흔적을 최대한 보존할 수 있다.\n(라) 조사 결과를 바탕으로 꼭 필요한 부분만 최소한으로 손을 댄다.","choices":["① (가)-(라)-(나)-(다)","② (나)-(가)-(라)-(다)","③ (나)-(라)-(가)-(다)","④ (라)-(다)-(나)-(가)"],"answer":"②","translation":"文化財修復は単なる新品化ではない→まず材料・製法を調査→結果に基づき必要最小限だけ修復→そうして歴史的価値を保存。","grammar":"-아/어야の省略的な그래야『そうしてこそ』。","vocab":"복원=復元 / 제작 방식=製作方法 / 흔적=痕跡 / 손을 대다=手を加える","why":"『조사 결과』は直前に조사が必要。그래야は前の方法全体を受けて結論。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"文の並べ替え","section":"reading"},{"id":16,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.\n\n<이러한 변화는 소비자가 제품을 선택하는 기준에도 영향을 주고 있다.>\n\n과거에는 제품을 살 때 가격과 성능을 중요하게 보는 소비자가 많았다. ( ㉠ ) 최근에는 생산 과정이 환경에 미치는 영향이나 포장재의 재활용 가능성까지 살피는 사람이 늘었다. ( ㉡ ) 기업들도 친환경 원료와 포장을 강조한 제품을 내놓고 있다. ( ㉢ ) 다만 표시만 친환경적으로 보이게 하는 경우도 있어 정보를 꼼꼼히 확인할 필요가 있다. ( ㉣ )","choices":["① ㉠","② ㉡","③ ㉢","④ ㉣"],"answer":"②","translation":"以前は価格・性能重視だったが、最近は環境影響まで見る人が増えた。『この変化は選択基準にも影響している』の後、企業の対応へ続く。","grammar":"이러한 변화는 앞 문장의 ‘환경을 고려하는 소비 증가’를 받는다。지시어 연결이 핵심。","vocab":"생산 과정=生産過程 / 재활용 가능성=リサイクル可能性 / 꼼꼼히=入念に","why":"㉡に入れると『消費者の変化→選択基準への影響→企業の対応』が自然。","answerIndex":1,"categoryKo":"문장 삽입","categoryJa":"文挿入","section":"reading"},{"id":17,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.\n\n<하지만 기록이 많다고 해서 기억이 반드시 더 정확해지는 것은 아니다.>\n\n스마트폰이 보편화되면서 우리는 일상의 많은 순간을 사진과 영상으로 남긴다. ( ㉠ ) 예전보다 훨씬 많은 장면을 기록할 수 있게 된 것이다. ( ㉡ ) 기록에 지나치게 의존하면 그 순간의 감정이나 주변 상황에 집중하지 못할 수 있다. ( ㉢ ) 그래서 특별한 경험을 할 때는 사진을 남기는 것과 직접 경험하는 것 사이의 균형이 필요하다. ( ㉣ )","choices":["① ㉠","② ㉡","③ ㉢","④ ㉣"],"answer":"②","translation":"スマホで多くの瞬間を記録できるようになった。しかし、記録が多いからといって記憶が正確になるとは限らない。記録に依存しすぎると体験への集中が下がる。","grammar":"-다고 해서 반드시 -는 것은 아니다『～だからといって必ずしも～わけではない』。","vocab":"보편화되다=普及する / 지나치게=過度に / 의존하다=依存する / 균형=バランス","why":"『하지만』は直前の肯定的内容を反転させ、その後の問題点につなぐので㉡。","answerIndex":1,"categoryKo":"문장 삽입","categoryJa":"文挿入","section":"reading"},{"id":18,"stem":"다음 문장이 들어갈 곳으로 가장 알맞은 것을 고르십시오.\n\n<이처럼 빈 공간을 활용하면 도시의 온도를 낮추는 데에도 도움이 된다.>\n\n도시의 건물 옥상은 오랫동안 비어 있는 공간으로 남아 있는 경우가 많았다. ( ㉠ ) 최근에는 이곳에 나무와 풀을 심어 작은 정원으로 만드는 사례가 늘고 있다. ( ㉡ ) 식물이 햇빛을 흡수하고 건물 표면의 온도가 지나치게 올라가는 것을 막아 주기 때문이다. ( ㉢ ) 또한 빗물을 잠시 저장해 갑작스러운 폭우 때 배수 시설의 부담을 줄이는 효과도 있다. ( ㉣ )","choices":["① ㉠","② ㉡","③ ㉢","④ ㉣"],"answer":"③","translation":"屋上の空き空間を緑化すると、植物が日光を吸収して表面温度の上昇を抑える。そのような空間活用は都市温度の低下にも役立ち、さらに雨水貯留効果もある。","grammar":"-는 데 도움이 되다『～するのに役立つ』。이처럼は前の具体説明をまとめる。","vocab":"옥상=屋上 / 흡수하다=吸収する / 배수 시설=排水設備 / 부담=負担","why":"温度上昇を防ぐ説明の直後にまとめ文を置き、その後『또한』で別効果を追加するため㉢。","answerIndex":2,"categoryKo":"문장 삽입","categoryJa":"文挿入","section":"reading"},{"id":19,"stem":"사람들은 선택지가 많으면 더 좋은 결정을 할 수 있을 것이라고 생각한다. 그러나 선택지가 지나치게 많으면 각각의 장단점을 비교하는 데 많은 에너지가 든다. 그 결과 결정을 미루거나, 선택한 뒤에도 다른 것을 골랐어야 했다고 후회하기 쉽다. 즉 선택지가 많을수록 항상 만족도가 높아지는 것은 아니며 오히려 (          ).\n\n(          )에 들어갈 가장 알맞은 것을 고르십시오.","choices":["① 결정의 부담이 커질 수 있다","② 선택의 기준이 사라질 수밖에 없다","③ 좋은 선택을 반드시 하게 된다","④ 다른 사람의 의견을 들을 필요가 없다"],"answer":"①","translation":"選択肢が多すぎると比較にエネルギーを使い、決定を先延ばししたり後悔したりしやすい。つまり、むしろ決定の負担が大きくなり得る。","grammar":"-을수록 항상 -는 것은 아니다『～ほど常に～というわけではない』。오히려=むしろ。","vocab":"선택지=選択肢 / 장단점=長短 / 미루다=先延ばしする / 후회하다=後悔する","why":"前文の結果を一文で要約する①。","answerIndex":0,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":20,"stem":"사람들은 선택지가 많으면 더 좋은 결정을 할 수 있을 것이라고 생각한다. 그러나 선택지가 지나치게 많으면 각각의 장단점을 비교하는 데 많은 에너지가 든다. 그 결과 결정을 미루거나, 선택한 뒤에도 다른 것을 골랐어야 했다고 후회하기 쉽다. 즉 선택지가 많을수록 항상 만족도가 높아지는 것은 아니며 오히려 결정의 부담이 커질 수 있다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 선택지가 많을수록 결정 시간은 반드시 짧아진다.","② 선택 후의 후회는 선택지의 수와 관계가 없다.","③ 선택지가 너무 많으면 결정을 내리는 일이 힘들 수 있다.","④ 좋은 결정을 하려면 가능한 모든 선택지를 비교해야 한다."],"answer":"③","translation":"選択肢が多すぎると決定自体が難しくなる場合がある。","grammar":"내용 일치 문제는 과장 표현(반드시, 모든)을 경계。","vocab":"관계가 없다=関係がない / 가능한=可能な","why":"③だけが本文の主張と一致。①④は『必ず／すべて』で過度に一般化。","answerIndex":2,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":21,"stem":"제품을 개발할 때 기능을 많이 넣으면 소비자가 더 좋아할 것이라고 생각하기 쉽다. 그러나 실제 사용자는 자주 쓰는 기능을 빠르고 쉽게 이용하기를 원한다. 기능이 아무리 많아도 사용법이 지나치게 복잡하면 결국 ‘빛 좋은 개살구’가 되기 쉽다.\n\n밑줄 친 ‘빛 좋은 개살구’의 의미로 가장 알맞은 것을 고르십시오.","choices":["① 겉보기는 좋지만 실제 가치는 부족한 것","② 오래 사용할수록 가치가 높아지는 것","③ 기능이 적어도 가격이 비싼 것","④ 보기보다 사용법이 단순한 것"],"answer":"①","translation":"機能が多く見栄えが良くても、使いにくければ『見かけ倒し』になりやすい。","grammar":"관용 표현은 문맥 속 평가 방향(긍정/부정)을 먼저 잡는다。","vocab":"빛 좋은 개살구=見かけはよいが中身が伴わないもの / 지나치게=過度に","why":"本文では複雑で使いにくい製品を否定的に評価しているため①。","answerIndex":0,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":22,"stem":"제품을 개발할 때 기능을 많이 넣으면 소비자가 더 좋아할 것이라고 생각하기 쉽다. 그러나 실제 사용자는 자주 쓰는 기능을 빠르고 쉽게 이용하기를 원한다. 기능이 아무리 많아도 사용법이 지나치게 복잡하면 결국 ‘빛 좋은 개살구’가 되기 쉽다.\n\n위 글의 중심 생각으로 가장 알맞은 것을 고르십시오.","choices":["① 제품은 가능한 한 많은 기능을 갖추어야 한다.","② 제품 개발에서는 기능 수보다 사용 편의성을 고려해야 한다.","③ 소비자는 새로운 기능을 배우는 데 시간을 써야 한다.","④ 가격이 낮은 제품은 기능도 단순한 것이 좋다."],"answer":"②","translation":"製品開発では、機能の多さより使いやすさを考えるべきだ。","grammar":"중심 생각은 반복되는 대비: 기능 많음 ↔ 사용 편의성。","vocab":"사용 편의성=使いやすさ / 고려하다=考慮する","why":"②が筆者の評価を最も正確にまとめる。","answerIndex":1,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":23,"stem":"지난 주말 나는 동네 장터에 처음으로 직접 만든 비누를 팔러 나갔다. 손님이 오기 전까지는 가격표를 잘 붙였는지, 거스름돈은 충분한지 계속 확인했다. 그런데 첫 손님이 큰돈을 내자 준비한 잔돈이 부족해 순간 머리가 하얘졌다. 옆 가게 주인이 잔돈을 바꿔 주어 겨우 상황을 해결했다. 오후에는 손님들과 자연스럽게 이야기할 수 있었고 준비한 비누도 거의 다 팔렸다. 집으로 돌아오는 길에는 다음 장터에는 더 잘할 수 있을 것 같았다.\n\n글에 나타난 ‘나’의 심정 변화로 가장 알맞은 것을 고르십시오.","choices":["① 긴장스럽다 → 뿌듯하다","② 섭섭하다 → 화가 나다","③ 지루하다 → 두렵다","④ 자신만만하다 → 후회스럽다"],"answer":"①","translation":"初出店で緊張し、途中でトラブルもあったが、最後にはほぼ完売して『次はもっとできそうだ』と達成感を感じている。","grammar":"심정 문제는 감정 단어가 없어도 행동·상황으로 추론。","vocab":"거스름돈=お釣り / 잔돈=小銭 / 머리가 하얘지다=頭が真っ白になる / 뿌듯하다=満足感がある","why":"序盤は何度も確認＝緊張、終盤は成功と自信＝誇らしい・満足。","answerIndex":0,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":24,"stem":"지난 주말 나는 동네 장터에 처음으로 직접 만든 비누를 팔러 나갔다. 손님이 오기 전까지는 가격표를 잘 붙였는지, 거스름돈은 충분한지 계속 확인했다. 그런데 첫 손님이 큰돈을 내자 준비한 잔돈이 부족해 순간 머리가 하얘졌다. 옆 가게 주인이 잔돈을 바꿔 주어 겨우 상황을 해결했다. 오후에는 손님들과 자연스럽게 이야기할 수 있었고 준비한 비누도 거의 다 팔렸다. 집으로 돌아오는 길에는 다음 장터에는 더 잘할 수 있을 것 같았다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 나는 장터에서 비누를 처음 샀다.","② 첫 손님은 잔돈이 부족해서 물건을 사지 못했다.","③ 옆 가게 주인이 나에게 도움을 주었다.","④ 나는 준비한 비누를 절반도 팔지 못했다."],"answer":"③","translation":"隣の店主がお釣り用の小銭を交換して助けてくれた。","grammar":"내용 일치에서는 주체(누가 무엇을 했는지)를 정확히 확인。","vocab":"겨우=やっと / 해결하다=解決する / 거의 다=ほとんど全部","why":"③が本文通り。","answerIndex":2,"categoryKo":"단문 독해","categoryJa":"短文読解","section":"reading"},{"id":25,"stem":"공유 우산, 빌린 곳 아닌 지하철역에서도 반납… 이용자 ‘편해졌다’\n\n이 신문 기사의 내용으로 가장 알맞은 것을 고르십시오.","choices":["① 공유 우산의 대여 가격이 크게 올랐다.","② 공유 우산의 반납 장소가 다양해져 이용이 편리해졌다.","③ 지하철역에서 개인 우산을 무료로 나누어 준다.","④ 공유 우산은 빌린 장소에 반드시 돌려줘야 한다."],"answer":"②","translation":"シェア傘は借りた場所だけでなく地下鉄駅でも返却できるようになり、利便性が高まった。","grammar":"신문 제목은 조사 생략·명사형이 많다. ‘…에서도’가 핵심。","vocab":"공유 우산=シェア傘 / 반납 장소=返却場所 / 다양해지다=多様化する","why":"見出しの因果『返却場所拡大→便利』をそのまま 풀어 쓴 ②。","answerIndex":1,"categoryKo":"신문 제목","categoryJa":"新聞見出し","section":"reading"},{"id":26,"stem":"작은 도서관의 큰 변화, 주말 운영 늘리자 가족 이용 두 배\n\n이 신문 기사의 내용으로 가장 알맞은 것을 고르십시오.","choices":["① 주말 운영을 확대하자 가족 단위 이용자가 크게 늘었다.","② 작은 도서관이 줄어 가족들이 이용하기 어려워졌다.","③ 도서관 이용료를 낮추자 평일 이용자가 두 배가 됐다.","④ 가족 이용자가 늘어 주말 운영 시간을 줄이기로 했다."],"answer":"①","translation":"小規模図書館が週末の開館を増やしたところ、家族利用が2倍になった。","grammar":"-자 여기서는 시간 순서+결과『～すると』。","vocab":"가족 단위=家族単位 / 운영을 늘리다=運営時間・回数を増やす / 두 배=2倍","why":"因果関係を正しく言い換えた①。","answerIndex":0,"categoryKo":"신문 제목","categoryJa":"新聞見出し","section":"reading"},{"id":27,"stem":"채용 시장, ‘무엇을 아는가’보다 ‘무엇을 해 봤나’ 본다\n\n이 신문 기사의 내용으로 가장 알맞은 것을 고르십시오.","choices":["① 기업이 지원자의 실제 경험을 이전보다 중요하게 평가한다.","② 채용에서는 지식 시험의 비중이 계속 높아지고 있다.","③ 지원자는 경험보다 자격증을 많이 준비해야 한다.","④ 기업은 지원자의 전공 지식을 전혀 평가하지 않는다."],"answer":"①","translation":"採用市場では『何を知っているか』より『何をやった経験があるか』を重視する傾向。","grammar":"-보다『～より』は比較。해 봤나=해 보다＋疑問の縮約的見出し表現。","vocab":"채용 시장=採用市場 / 지원자=応募者 / 실제 경험=実務・実際の経験","why":"①が比較の方向を正確に表す。④の『全く評価しない』は極端。","answerIndex":0,"categoryKo":"신문 제목","categoryJa":"新聞見出し","section":"reading"},{"id":28,"stem":"전문가들은 운동을 시작할 때 처음부터 무리한 목표를 세우면 오래 지속하기 어렵다고 말한다. 목표가 너무 크면 몇 번 실천하지 못했을 때 쉽게 포기하게 되기 때문이다. 그러므로 운동 습관을 만들기 위해서는 (          ).","choices":["① 실천 가능한 작은 목표부터 세우는 것이 좋다","② 짧은 기간에 운동량을 최대한 늘려야 한다","③ 효과가 보이지 않으면 운동 종류를 매일 바꿔야 한다","④ 다른 사람과 경쟁할 수 있는 목표만 정해야 한다"],"answer":"①","translation":"最初から無理な目標を立てると続きにくいので、実行可能な小さな目標から始めるのがよい。","grammar":"그러므로=したがって。앞의 원인→결론。","vocab":"무리한 목표=無理な目標 / 지속하다=継続する / 포기하다=諦める / 실천 가능하다=実行可能だ","why":"前の問題点を解決する具体策は①。","answerIndex":0,"categoryKo":"빈칸 추론","categoryJa":"空欄推論","section":"reading"},{"id":29,"stem":"자동 요약 기능은 긴 문서의 핵심을 빠르게 파악하는 데 유용하다. 특히 많은 자료를 짧은 시간에 검토해야 할 때 도움이 된다. 그러나 계약서나 규정처럼 작은 표현 하나가 의미를 바꿀 수 있는 문서는 요약 과정에서 중요한 조건이 빠질 수도 있다. 따라서 중요한 결정을 내려야 할 때는 (          ).","choices":["① 요약문만 읽고 바로 판단하는 것이 효율적이다","② 원문을 직접 확인하는 과정이 필요하다","③ 긴 문서는 가능한 한 읽지 않는 것이 좋다","④ 요약 기능의 사용을 전면 금지해야 한다"],"answer":"②","translation":"自動要約は便利だが、契約書などでは条件が抜ける可能性があるため、重要な判断時は原文確認が必要。","grammar":"-을 수도 있다『～することもあり得る』＝可能性。따라서で対策へ。","vocab":"핵심=核心 / 파악하다=把握する / 규정=規定 / 빠지다=抜ける / 원문=原文","why":"利点を認めつつ重要時の補完策を述べる②。④は本文より過激。","answerIndex":1,"categoryKo":"빈칸 추론","categoryJa":"空欄推論","section":"reading"},{"id":30,"stem":"평일에 잠이 부족한 사람은 주말에 늦잠을 자서 피로를 풀려고 한다. 어느 정도의 추가 수면은 도움이 될 수 있지만 평일과 주말의 기상 시간이 너무 크게 차이 나면 생체 리듬이 흐트러질 수 있다. 그래서 수면의 질을 높이려면 (          ).","choices":["① 주말마다 평소보다 훨씬 늦게 일어나야 한다","② 평일에는 수면 시간을 더 줄여야 한다","③ 평일과 주말의 취침·기상 시간을 가능한 일정하게 유지해야 한다","④ 피곤할수록 낮잠을 오래 자야 한다"],"answer":"③","translation":"週末の寝だめが多少役立つことはあっても、平日との時間差が大きいと体内リズムが乱れる。就寝・起床時間をなるべく一定にするべき。","grammar":"-려면『～するには』。어느 정도=ある程度。","vocab":"기상 시간=起床時間 / 생체 리듬=生体リズム / 흐트러지다=乱れる / 유지하다=維持する","why":"本文の問題点『時間差』を直接解決する③。","answerIndex":2,"categoryKo":"빈칸 추론","categoryJa":"空欄推論","section":"reading"},{"id":31,"stem":"최근 박물관에서는 관람객이 직접 만지고 움직이면서 내용을 이해하는 체험형 전시가 늘고 있다. 이런 전시는 관람객의 흥미를 높인다는 장점이 있다. 하지만 체험 장치 자체가 너무 화려하면 관람객의 관심이 전시 내용보다 장치에만 머물 수 있다. 따라서 좋은 체험형 전시는 (          ).","choices":["① 체험 장치의 수를 가능한 한 많이 늘려야 한다","② 체험이 전시 내용을 이해하는 데 도움이 되도록 설계되어야 한다","③ 관람객이 전시 설명을 읽지 못하게 해야 한다","④ 전시 내용보다 새로운 기술을 보여 주는 데 집중해야 한다"],"answer":"②","translation":"体験型展示は興味を高めるが、装置自体が派手すぎると内容が霞む。体験が展示内容の理解を助けるよう設計すべき。","grammar":"-도록『～するように』目的・方向。","vocab":"체험형 전시=体験型展示 / 장치=装置 / 머물다=とどまる / 설계되다=設計される","why":"長所を維持しつつ欠点を防ぐ②。","answerIndex":1,"categoryKo":"빈칸 추론","categoryJa":"空欄推論","section":"reading"},{"id":32,"stem":"도심의 나무는 그늘을 만들어 보행자가 느끼는 더위를 줄여 준다. 또한 잎에서 수분이 증발하는 과정에서 주변의 열을 낮추는 효과도 있다. 그러나 나무의 종류와 심는 위치를 고려하지 않으면 뿌리가 보도블록을 밀어 올리거나 건물의 채광을 방해할 수 있다. 따라서 도시의 나무는 단순히 많이 심는 것보다 공간의 특성에 맞게 계획하는 것이 중요하다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 도시에서는 나무를 많이 심을수록 항상 좋다.","② 나무의 잎은 주변 온도를 높이는 역할을 한다.","③ 도시의 나무는 위치와 종류를 고려해 심어야 한다.","④ 나무의 뿌리는 보도블록에 영향을 주지 않는다."],"answer":"③","translation":"都市の木は暑さを和らげるが、種類や位置を誤ると歩道や採光に問題が出るため、空間特性に合わせた計画が重要。","grammar":"-지 않으면『～しなければ』条件。단순히 A보다 B가 중요하다『単にAよりBが重要』。","vocab":"그늘=日陰 / 증발하다=蒸発する / 채광=採光 / 보도블록=歩道ブロック","why":"③が結論と一致。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":33,"stem":"손으로 글을 쓸 때는 필요한 내용을 고르고 짧게 정리하면서 적는 경우가 많다. 반면 키보드로 입력할 때는 들은 내용을 빠르게 그대로 옮기기 쉽다. 그래서 어떤 학습 상황에서는 손으로 메모하는 과정 자체가 내용을 다시 생각하게 만드는 역할을 할 수 있다. 중요한 것은 어느 방식이 무조건 더 좋다고 보는 것이 아니라 학습 목적에 따라 기록 방식을 선택하는 것이다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 키보드로 기록하면 내용을 생각할 수 없다.","② 손으로 쓰는 것은 모든 학습 상황에서 더 효과적이다.","③ 기록 방식은 학습 목적에 따라 선택할 필요가 있다.","④ 빠르게 기록하려면 반드시 손으로 써야 한다."],"answer":"③","translation":"手書きは要約しながら書くため再考につながる場合があるが、どちらが常に優れているのではなく、学習目的に応じて選ぶべき。","grammar":"무조건『無条件に／何が何でも』を否定する表現に注意。","vocab":"옮기다=移す・書き写す / 과정 자체=過程そのもの / 목적에 따라=目的に応じて","why":"筆者は二者択一ではなく目的別選択を主張。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":34,"stem":"고장 난 물건을 버리지 않고 함께 고쳐 쓰는 ‘수리 모임’이 여러 지역에서 열리고 있다. 참가자는 기술을 가진 자원봉사자에게 수리 방법을 배우고 직접 물건을 고친다. 이런 활동은 쓰레기를 줄이는 데 도움이 될 뿐만 아니라 사람들 사이에 기술과 경험을 나누는 기회도 만든다. 최근에는 수리하기 쉽게 제품을 설계해야 한다는 관심으로도 이어지고 있다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 수리 모임에서는 전문가만 물건을 고칠 수 있다.","② 수리 모임은 쓰레기를 늘리는 원인이 되고 있다.","③ 수리 모임은 기술과 경험을 나누는 기회를 제공한다.","④ 최근에는 제품을 수리하기 어렵게 만드는 설계가 주목받고 있다."],"answer":"③","translation":"修理会ではボランティアから方法を学び自分で修理する。廃棄物削減だけでなく、技術と経験を共有する機会にもなる。","grammar":"-뿐만 아니라『～だけでなく』。-로도 이어지다『～へもつながる』。","vocab":"자원봉사자=ボランティア / 고쳐 쓰다=修理して使う / 설계=設計","why":"③が本文の二つ目の効果と一致。","answerIndex":2,"categoryKo":"내용 일치","categoryJa":"内容一致","section":"reading"},{"id":35,"stem":"그래프는 복잡한 정보를 한눈에 보여 주는 유용한 도구다. 그러나 같은 자료라도 세로축의 범위를 어떻게 정하느냐에 따라 변화가 매우 커 보이거나 작아 보일 수 있다. 또한 일부 기간만 잘라 보여 주면 전체 흐름과 다른 인상을 줄 수도 있다. 따라서 그래프를 볼 때는 숫자뿐 아니라 축의 범위와 자료가 선택된 기간까지 함께 확인해야 한다.\n\n이 글의 주제로 가장 알맞은 것을 고르십시오.","choices":["① 그래프는 숫자보다 그림이 중요하다.","② 그래프를 정확히 이해하려면 표현 방식과 자료 범위를 함께 살펴야 한다.","③ 그래프는 복잡한 자료를 표현하기에 적절하지 않다.","④ 그래프의 세로축은 항상 같은 범위로 설정해야 한다."],"answer":"②","translation":"グラフは便利だが、軸や期間の切り取り方で印象が変わるため、表現方法とデータ範囲も確認すべき。","grammar":"-느냐에 따라『～するかによって』。-을 수도 있다『～することもある』。","vocab":"세로축=縦軸 / 범위=範囲 / 전체 흐름=全体の流れ / 인상=印象","why":"具体例をまとめる主張が②。","answerIndex":1,"categoryKo":"주제 파악","categoryJa":"主題把握","section":"reading"},{"id":36,"stem":"지역 축제는 관광객을 많이 모으는 것만으로 성공을 판단하기 어렵다. 축제 때문에 소음과 쓰레기가 늘어 주민의 불편이 커진다면 다음 해에는 지역의 지지를 얻기 힘들 수 있다. 반대로 주민이 기획에 참여하고 지역 상점과 예술가가 함께하면 축제가 끝난 뒤에도 지역에 경험과 수익이 남는다. 그러므로 지역 축제는 방문객 수뿐 아니라 주민 참여와 지속 가능성도 함께 고려해야 한다.\n\n이 글의 주제로 가장 알맞은 것을 고르십시오.","choices":["① 지역 축제는 관광객 수만 많으면 성공한 것이다.","② 지역 축제는 주민과 지역 사회에 남는 효과까지 고려해야 한다.","③ 지역 축제에서는 주민보다 외부 예술가의 역할이 중요하다.","④ 지역 축제는 소음 문제 때문에 운영하지 않는 것이 좋다."],"answer":"②","translation":"地域祭りの成功は観光客数だけでなく、住民参加や地域に残る効果・持続可能性まで見るべき。","grammar":"-뿐 아니라『～だけでなく』。반대로=逆に。","vocab":"기획=企画 / 지지=支持 / 지속 가능성=持続可能性 / 수익=収益","why":"筆者は単一指標ではなく複数の地域効果を評価すべきだと主張。","answerIndex":1,"categoryKo":"주제 파악","categoryJa":"主題把握","section":"reading"},{"id":37,"stem":"온라인 학습은 시간과 장소의 제약을 줄여 학습 기회를 넓힌다. 또한 학습자가 자신의 속도에 맞춰 반복해서 공부할 수 있다는 장점도 있다. 그러나 정해진 시간표가 없으면 학습을 미루기 쉽고, 질문을 바로 해결하기 어려울 수도 있다. 따라서 온라인 학습의 효과를 높이기 위해서는 학습자가 스스로 계획을 세우는 능력과 적절한 피드백을 받을 수 있는 환경이 필요하다.\n\n이 글의 주제로 가장 알맞은 것을 고르십시오.","choices":["① 온라인 학습은 교실 수업보다 항상 효과적이다.","② 온라인 학습은 반복 학습이 불가능하다.","③ 온라인 학습의 장점을 살리려면 자기 관리와 피드백 환경이 필요하다.","④ 온라인 학습에서는 학습 계획을 세울 필요가 없다."],"answer":"③","translation":"オンライン学習の利点を生かすには、自己管理能力と適切なフィードバック環境が必要。","grammar":"-기 위해서는『～するためには』。","vocab":"제약=制約 / 반복하다=反復する / 미루다=先延ばしする / 피드백=フィードバック","why":"利点と弱点を統合した結論が③。","answerIndex":2,"categoryKo":"주제 파악","categoryJa":"主題把握","section":"reading"},{"id":38,"stem":"직장에서 피드백을 할 때 ‘당신은 책임감이 없다’처럼 사람의 성격을 평가하면 상대방이 방어적으로 반응하기 쉽다. 반면 ‘보고서 제출 시간이 두 번 늦어 일정 조정이 어려웠다’처럼 구체적인 행동과 그 영향을 설명하면 무엇을 바꿔야 하는지 분명해진다. 좋은 피드백은 사람 자체를 판단하기보다 관찰할 수 있는 행동과 개선 방향에 초점을 맞춰야 한다.\n\n이 글의 주제로 가장 알맞은 것을 고르십시오.","choices":["① 직장에서는 부정적인 피드백을 하지 않는 것이 좋다.","② 피드백은 성격보다 구체적인 행동과 개선 방향을 중심으로 해야 한다.","③ 피드백을 할 때는 문제의 원인을 숨기는 것이 좋다.","④ 상대방이 방어적으로 반응하면 피드백을 중단해야 한다."],"answer":"②","translation":"職場のフィードバックは人格評価ではなく、具体的行動と改善方向に焦点を当てるべき。","grammar":"-기보다『～するより／～するのではなく』。","vocab":"책임감=責任感 / 방어적으로=防御的に / 구체적=具体的 / 초점을 맞추다=焦点を合わせる","why":"最後の一文が主題を直接提示。","answerIndex":1,"categoryKo":"주제 파악","categoryJa":"主題把握","section":"reading"},{"id":39,"stem":"다음 글을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 이렇게 분리된 성분을 제거한 뒤 다시 향과 맛을 조정하면 카페인이 적은 커피가 만들어진다.\n(나) 디카페인 커피는 원두를 볶기 전에 물이나 증기 등으로 처리해 카페인이 빠져나오기 쉬운 상태로 만든다.\n(다) 그다음 물이나 특정 용매를 이용해 원두에서 카페인 성분을 분리한다.","choices":["① (가)-(나)-(다)","② (나)-(다)-(가)","③ (나)-(가)-(다)","④ (다)-(나)-(가)"],"answer":"②","translation":"デカフェ製造：焙煎前に水・蒸気で処理→カフェインを分離→分離した成分を除き味と香りを調整。","grammar":"그다음=その次 / 이렇게=このように。지시어로 앞문장 연결。","vocab":"원두=コーヒー豆 / 볶다=焙煎する / 용매=溶媒 / 분리하다=分離する","why":"『그다음』の前に最初の工程が必要、이렇게は直前の分離を受ける。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"論理展開","section":"reading"},{"id":40,"stem":"다음 글을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 물이 천천히 빠져나가면서 홍수 위험을 줄이고, 흙과 식물이 일부 오염 물질을 걸러 내는 효과도 생긴다.\n(나) 인공 습지는 비가 많이 올 때 빗물을 잠시 저장할 수 있도록 도시 안에 만든 공간이다.\n(다) 그래서 최근에는 공원과 하천 주변에 인공 습지를 함께 조성하는 도시가 늘고 있다.","choices":["① (가)-(다)-(나)","② (나)-(가)-(다)","③ (나)-(다)-(가)","④ (다)-(나)-(가)"],"answer":"②","translation":"人工湿地の定義→洪水軽減・汚染物質ろ過の効果→そのため都市で造成が増加。","grammar":"그래서=だから。정의→기능→결과の典型構成。","vocab":"습지=湿地 / 저장하다=貯留する / 걸러 내다=ろ過する / 조성하다=造成する","why":"(나)가概念提示、(가)가効果、(다)가社会的結果。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"論理展開","section":"reading"},{"id":41,"stem":"다음 글을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 이후 그 표현이 여러 세대와 상황에서 널리 쓰이게 되면 사전에 새 표제어로 실리기도 한다.\n(나) 새로운 말이 생겼다고 해서 곧바로 사전에 올라가는 것은 아니다.\n(다) 사전 편찬자는 실제 사용 자료를 오랫동안 살펴 그 말이 일시적인 유행인지 지속적으로 쓰이는 표현인지 확인한다.","choices":["① (나)-(다)-(가)","② (다)-(나)-(가)","③ (가)-(나)-(다)","④ (나)-(가)-(다)"],"answer":"①","translation":"新語はすぐ辞書に載るのではなく→編纂者が長期間使用実態を確認→広く定着すれば新しい見出し語として載ることもある。","grammar":"-다고 해서 곧바로 -는 것은 아니다『～だからといってすぐ～わけではない』。이후=その後。","vocab":"사전 편찬자=辞書編纂者 / 일시적 유행=一時的流行 / 표제어=見出し語","why":"時間順が明確。","answerIndex":0,"categoryKo":"문장 배열","categoryJa":"論理展開","section":"reading"},{"id":42,"stem":"할머니 댁 창고에는 오래된 재봉틀이 한 대 있었다. 나는 처음에는 먼지만 쌓이는 물건이라고 생각했다. 어느 날 할머니가 그 재봉틀로 내 아버지의 교복과 이모의 결혼식 옷까지 만들었다는 이야기를 들려주셨다. 나는 호기심이 생겨 할머니와 함께 재봉틀을 닦고 기름을 칠했다. 손잡이를 돌리자 오랫동안 멈춰 있던 바퀴가 천천히 움직였다. 할머니는 ‘이 소리를 다시 듣게 될 줄 몰랐다’며 웃으셨다. 그날 이후 나는 창고를 지날 때마다 그 재봉틀을 그냥 낡은 물건으로 볼 수 없었다.\n\n글에 나타난 ‘나’의 심정 변화로 가장 알맞은 것을 고르십시오.","choices":["① 무관심하다 → 의미 있게 여기다","② 자랑스럽다 → 부끄러워하다","③ 두렵다 → 화가 나다","④ 기대하다 → 실망하다"],"answer":"①","translation":"最初は埃をかぶる古い物としか思わなかったが、家族の記憶を知り修理した後、意味のある物として見るようになる。","grammar":"서사형 심정은 ‘처음에는’과 ‘그날 이후’의 대비를 확인。","vocab":"재봉틀=ミシン / 먼지가 쌓이다=埃が積もる / 기름을 칠하다=油を差す / 낡다=古びる","why":"価値認識の変化なので①。","answerIndex":0,"categoryKo":"이야기 독해","categoryJa":"物語読解","section":"reading"},{"id":43,"stem":"할머니 댁 창고에는 오래된 재봉틀이 한 대 있었다. 나는 처음에는 먼지만 쌓이는 물건이라고 생각했다. 어느 날 할머니가 그 재봉틀로 내 아버지의 교복과 이모의 결혼식 옷까지 만들었다는 이야기를 들려주셨다. 나는 호기심이 생겨 할머니와 함께 재봉틀을 닦고 기름을 칠했다. 손잡이를 돌리자 오랫동안 멈춰 있던 바퀴가 천천히 움직였다. 할머니는 ‘이 소리를 다시 듣게 될 줄 몰랐다’며 웃으셨다. 그날 이후 나는 창고를 지날 때마다 그 재봉틀을 그냥 낡은 물건으로 볼 수 없었다.\n\n위 글의 내용과 같은 것을 고르십시오.","choices":["① 할머니는 재봉틀을 최근에 새로 샀다.","② 나는 혼자 재봉틀을 버렸다.","③ 그 재봉틀로 가족의 옷을 만든 적이 있다.","④ 재봉틀은 끝까지 움직이지 않았다."],"answer":"③","translation":"そのミシンは父の制服や叔母の結婚式の服を作るのに使われたことがある。","grammar":"-ㄴ/은 적이 있다『～したことがある』。","vocab":"교복=制服 / 결혼식 옷=結婚式の服 / 손잡이=ハンドル","why":"③が本文の家族史と一致。","answerIndex":2,"categoryKo":"이야기 독해","categoryJa":"物語読解","section":"reading"},{"id":44,"stem":"공공 서비스의 디지털 전환은 대기 시간을 줄이고 행정 비용을 낮출 수 있다는 점에서 효율적이다. 그러나 모든 시민이 같은 수준의 디지털 기기와 활용 능력을 갖고 있는 것은 아니다. 온라인 신청만 가능하게 만들면 고령자나 장애인, 한국어가 익숙하지 않은 사람에게 새로운 장벽이 생길 수 있다. 기술 도입의 목적이 시민의 편의를 높이는 것이라면 (          ). 오프라인 창구를 완전히 없애기보다 도움을 받을 수 있는 방법을 함께 마련하는 것이 필요하다.\n\n(          )에 들어갈 가장 알맞은 것을 고르십시오.","choices":["① 서비스 속도만을 기준으로 성과를 평가해야 한다","② 효율성과 접근성을 함께 고려해야 한다","③ 모든 행정 절차를 즉시 온라인으로 바꿔야 한다","④ 디지털 기기 사용이 어려운 사람은 서비스를 이용하지 않아야 한다"],"answer":"②","translation":"公共サービスのデジタル化は効率的だが、デジタル弱者に新たな壁を作り得る。目的が市民の利便性なら、効率性とアクセシビリティを共に考える必要がある。","grammar":"-다면『もし～なら』。A라면 B해야 한다의 논리。","vocab":"디지털 전환=DX・デジタル転換 / 행정 비용=行政コスト / 장벽=障壁 / 접근성=アクセシビリティ","why":"後文の『オフライン支援も用意』と一致する②。","answerIndex":1,"categoryKo":"고급 독해","categoryJa":"上級読解","section":"reading"},{"id":45,"stem":"공공 서비스의 디지털 전환은 대기 시간을 줄이고 행정 비용을 낮출 수 있다는 점에서 효율적이다. 그러나 모든 시민이 같은 수준의 디지털 기기와 활용 능력을 갖고 있는 것은 아니다. 온라인 신청만 가능하게 만들면 고령자나 장애인, 한국어가 익숙하지 않은 사람에게 새로운 장벽이 생길 수 있다. 기술 도입의 목적이 시민의 편의를 높이는 것이라면 효율성과 접근성을 함께 고려해야 한다. 오프라인 창구를 완전히 없애기보다 도움을 받을 수 있는 방법을 함께 마련하는 것이 필요하다.\n\n이 글의 중심 생각으로 가장 알맞은 것을 고르십시오.","choices":["① 공공 서비스는 비용을 줄이는 것이 가장 중요하다.","② 디지털 전환은 모든 시민에게 똑같이 편리하다.","③ 공공 서비스의 디지털화에서는 이용이 어려운 사람을 위한 접근 방법도 마련해야 한다.","④ 행정 서비스는 온라인 방식만 남겨야 효율적이다."],"answer":"③","translation":"公共サービスのデジタル化では、利用が難しい人のための別のアクセス手段も確保すべき。","grammar":"-기보다『～するよりも／～するのではなく』の対比。","vocab":"오프라인 창구=対面窓口 / 마련하다=用意する","why":"③が主張を具体的かつ過不足なく要約。","answerIndex":2,"categoryKo":"고급 독해","categoryJa":"上級読解","section":"reading"},{"id":46,"stem":"다음 글을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 그러나 모든 씨앗을 같은 환경에서 보관할 수 있는 것은 아니어서 종류에 따라 온도와 습도를 다르게 조절해야 한다.\n(나) 씨앗 은행은 미래에 필요한 식물 자원을 보존하기 위해 다양한 식물의 씨앗을 모아 저장하는 시설이다.\n(다) 이렇게 보관한 씨앗은 자연재해나 병충해로 특정 작물이 크게 줄었을 때 다시 재배하기 위한 자료가 될 수 있다.","choices":["① (가)-(다)-(나)","② (나)-(가)-(다)","③ (나)-(다)-(가)","④ (다)-(나)-(가)"],"answer":"②","translation":"シードバンクの定義→種ごとに保存条件を調整する必要→保存種子は災害・病害虫時の再栽培資源になる。","grammar":"그러나가あるため、前に一般説明が必要。이렇게は保存方法全体を受ける。","vocab":"씨앗 은행=シードバンク / 병충해=病害虫被害 / 재배하다=栽培する / 보존=保存","why":"(나)導入→(가)条件・注意→(다)用途。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"論理展開","section":"reading"},{"id":47,"stem":"다음 글을 순서대로 맞게 배열한 것을 고르십시오.\n\n(가) 이때 만들어진 작은 실패 기록들이 쌓이면 다음 개발에서 같은 문제를 반복하지 않는 자료가 된다.\n(나) 새로운 제품을 개발하는 과정에서는 완성된 성공 사례뿐 아니라 실패한 실험을 기록하는 일도 중요하다.\n(다) 실패 원인과 당시의 조건을 구체적으로 남겨 두면 어떤 접근이 효과가 없었는지 다른 구성원도 확인할 수 있기 때문이다.","choices":["① (가)-(나)-(다)","② (나)-(다)-(가)","③ (다)-(가)-(나)","④ (나)-(가)-(다)"],"answer":"②","translation":"新製品開発では失敗実験の記録も重要→原因と条件を残せば他の人も確認できる→失敗記録の蓄積が再発防止資料になる。","grammar":"-기 때문이다が理由説明、이때가 앞의 기록 행위를 받는다。","vocab":"실패 원인=失敗原因 / 접근=アプローチ / 구성원=メンバー / 쌓이다=蓄積する","why":"主張→理由→長期的効果の順。","answerIndex":1,"categoryKo":"문장 배열","categoryJa":"論理展開","section":"reading"},{"id":48,"stem":"추천 알고리즘은 수많은 정보 중에서 사용자가 관심을 가질 만한 내용을 빠르게 찾도록 도와준다. 덕분에 우리는 음악, 영상, 기사, 상품을 찾는 데 쓰는 시간을 크게 줄일 수 있다. 문제는 추천이 과거의 선택을 바탕으로 이루어진다는 점이다. 비슷한 것만 계속 추천받다 보면 사용자는 자신이 원래 좋아하던 분야 안에 오래 머물게 되고, 우연히 낯선 정보를 만날 기회는 줄어들 수 있다. 선택의 폭을 넓혀 주기 위해 만들어진 기술이 오히려 (          ) 셈이다. 물론 추천 기능 자체를 피할 필요는 없다. 다만 때때로 추천 목록 밖의 자료를 직접 찾아보거나 서로 다른 관점을 의도적으로 접하는 습관이 필요하다. 편리한 기술을 잘 쓰는 능력에는 기술이 대신 골라 주지 않은 것까지 살펴보는 태도도 포함된다.\n\n(          )에 들어갈 가장 알맞은 것을 고르십시오.","choices":["① 선택의 범위를 좁힐 수도 있는","② 모든 선택을 완전히 없애 버리는","③ 사용자의 관심을 정확히 넓혀 주는","④ 정보를 찾는 시간을 반드시 늘리는"],"answer":"①","translation":"推薦アルゴリズムは便利だが、過去の選択に似たものだけを提示し続けると、未知の情報との偶然の出会いが減り、選択範囲を狭める可能性がある。","grammar":"-다 보면『～し続けると』/ -는 셈이다『～ということになる』。","vocab":"추천 알고리즘=推薦アルゴリズム / 낯선 정보=未知・不慣れな情報 / 의도적으로=意図的に","why":"『幅を広げるための技術が逆に…』という逆説なので①。","answerIndex":0,"categoryKo":"종합 논설","categoryJa":"総合論説","section":"reading"},{"id":49,"stem":"추천 알고리즘은 수많은 정보 중에서 사용자가 관심을 가질 만한 내용을 빠르게 찾도록 도와준다. 덕분에 우리는 음악, 영상, 기사, 상품을 찾는 데 쓰는 시간을 크게 줄일 수 있다. 문제는 추천이 과거의 선택을 바탕으로 이루어진다는 점이다. 비슷한 것만 계속 추천받다 보면 사용자는 자신이 원래 좋아하던 분야 안에 오래 머물게 되고, 우연히 낯선 정보를 만날 기회는 줄어들 수 있다. 선택의 폭을 넓혀 주기 위해 만들어진 기술이 오히려 선택의 범위를 좁힐 수도 있는 셈이다. 물론 추천 기능 자체를 피할 필요는 없다. 다만 때때로 추천 목록 밖의 자료를 직접 찾아보거나 서로 다른 관점을 의도적으로 접하는 습관이 필요하다. 편리한 기술을 잘 쓰는 능력에는 기술이 대신 골라 주지 않은 것까지 살펴보는 태도도 포함된다.\n\n이 글에 나타난 글쓴이의 태도로 가장 알맞은 것을 고르십시오.","choices":["① 추천 기술의 편리함은 인정하지만 그 한계를 경계하고 있다.","② 추천 기술은 위험하므로 사용을 완전히 중단해야 한다고 주장한다.","③ 추천 기술이 사람의 선택을 항상 넓혀 준다고 확신한다.","④ 추천 기술보다 상품 가격 문제를 더 중요하게 보고 있다."],"answer":"①","translation":"筆者は推薦技術の利便性を認めつつ、似た情報への偏りという限界を警戒し、意識的に外へ出る習慣を提案している。","grammar":"물론 A. 다만 B. 구조는『A를 인정하되 B를 제한·보완』하는 태도를 자주 나타낸다。","vocab":"경계하다=警戒する / 확신하다=確信する / 한계=限界","why":"全面否定でも全面肯定でもないバランス型の①。","answerIndex":0,"categoryKo":"종합 논설","categoryJa":"総合論説","section":"reading"},{"id":50,"stem":"추천 알고리즘은 수많은 정보 중에서 사용자가 관심을 가질 만한 내용을 빠르게 찾도록 도와준다. 덕분에 우리는 음악, 영상, 기사, 상품을 찾는 데 쓰는 시간을 크게 줄일 수 있다. 문제는 추천이 과거의 선택을 바탕으로 이루어진다는 점이다. 비슷한 것만 계속 추천받다 보면 사용자는 자신이 원래 좋아하던 분야 안에 오래 머물게 되고, 우연히 낯선 정보를 만날 기회는 줄어들 수 있다. 선택의 폭을 넓혀 주기 위해 만들어진 기술이 오히려 선택의 범위를 좁힐 수도 있는 셈이다. 물론 추천 기능 자체를 피할 필요는 없다. 다만 때때로 추천 목록 밖의 자료를 직접 찾아보거나 서로 다른 관점을 의도적으로 접하는 습관이 필요하다. 편리한 기술을 잘 쓰는 능력에는 기술이 대신 골라 주지 않은 것까지 살펴보는 태도도 포함된다.\n\n이 글의 제목으로 가장 알맞은 것을 고르십시오.","choices":["① 추천의 편리함 뒤에 숨은 선택의 편향","② 상품 가격을 낮추는 가장 빠른 방법","③ 과거의 선택을 모두 버려야 하는 이유","④ 정보 검색 시간을 늘리는 새로운 기술"],"answer":"①","translation":"テーマは『推薦の便利さの裏で、過去の好みに偏って選択が狭まる問題』。","grammar":"제목 문제는 장점+문제점의 양면을 모두 포함하는 선택지가 강하다。","vocab":"편향=偏り・バイアス / 숨다=隠れる / 선택의 폭=選択の幅","why":"①が本文の利便性と偏りの両方を含む。","answerIndex":0,"categoryKo":"종합 논설","categoryJa":"総合論説","section":"reading"},{"id":51,"section":"writing","categoryKo":"쓰기 51번","categoryJa":"作文 51番","stem":"수업 시간 변경 안내\n이번 토요일 사진 수업은 강사님의 사정으로 오전에 진행하기 어렵습니다.\n그래서 이번 주 수업은 오후 2시에 ( ㉠ ).\n혹시 그 시간에 참석하기 어려우시면 ( ㉡ ).\n다음 주 보충 수업 일정을 안내해 드리겠습니다.","model":"㉠ 진행하려고 합니다 / 진행할 예정입니다\n㉡ 금요일까지 연락해 주시기 바랍니다 / 미리 연락해 주십시오","jp":"㉠は「時間を変更して授業を行う予定」を表すため、-려고 하다 / -(으)ㄹ 예정이다 が自然です。㉡は参加できない人への依頼なので -아/어 주시기 바랍니다 / -아/어 주십시오 のような丁寧な案内文体が適切です。","grammar":"-려고 하다 / -(으)ㄹ 예정이다 / -아/어 주시기 바랍니다 / -아/어 주십시오","vocab":"강사=講師 / 사정=事情 / 진행하다=実施する / 참석하다=参加する / 보충 수업=補講","target":"빈칸 2개를 자연스럽게 완성하세요.","min":0,"max":0},{"id":52,"section":"writing","categoryKo":"쓰기 52번","categoryJa":"作文 52番","stem":"스마트폰 알림은 필요한 정보를 빠르게 알려 준다는 장점이 있다. 그러나 일을 하는 동안 알림이 자주 울리면 집중하던 흐름이 끊기기 쉽다. 한 번 끊긴 집중을 다시 회복하는 데에는 시간이 필요하다. 따라서 중요한 일을 할 때는 알림을 ( ㉠ ). 그리고 알림을 확인할 시간을 따로 정해 두면 ( ㉡ ).","model":"㉠ 꺼 두는 것이 좋다 / 끄는 것이 좋다\n㉡ 집중력을 유지하는 데 도움이 된다 / 일에 더 집중할 수 있다","jp":"前半で「通知が集中を切る」という問題を提示しているため、㉠には通知を切る対策、㉡にはその効果を書きます。-는 것이 좋다、-는 데 도움이 되다 はTOPIK作文で使いやすい中級文法です。","grammar":"-는 것이 좋다 / -는 데 도움이 되다","vocab":"알림=通知 / 흐름이 끊기다=流れが途切れる / 회복하다=回復する / 집중력을 유지하다=集中力を維持する","target":"빈칸 2개를 문맥에 맞게 완성하세요.","min":0,"max":0},{"id":53,"section":"writing","categoryKo":"쓰기 53번","categoryJa":"作文 53番","stem":"‘한빛시 공공 자전거 이용 변화’에 대한 글을 200~300자로 쓰십시오. 단, 글의 제목을 쓰지 마십시오. (30점)\n\n[공공 자전거 이용 건수]\n2023년: 120만 건\n2025년: 185만 건\n\n[이용 목적]\n출퇴근: 38% → 52%\n여가: 45% → 31%\n기타: 17% → 17%\n\n[변화 원인]\n대여소: 180곳 → 260곳\n앱에서 실시간 대여 가능 자전거 정보 제공","model":"한빛시의 공공 자전거 이용 건수를 보면 2023년 120만 건에서 2025년 185만 건으로 크게 증가했다. 이용 목적 중 출퇴근 비율은 38%에서 52%로 늘어난 반면 여가 목적은 45%에서 31%로 줄었다. 이는 대여소가 180곳에서 260곳으로 확대되고 앱에서 실시간 대여 정보를 제공한 영향으로 보인다. 앞으로도 생활 교통 수단으로서 이용이 계속 늘어날 것으로 예상된다.","jp":"ハンビッ市の公共自転車利用件数を見ると、2023年の120万件から2025年には185万件へ大きく増加した。利用目的のうち通勤・通学は38％から52％へ増えた一方、余暇目的は45％から31％へ減少した。これは貸出所が180か所から260か所へ増え、アプリでリアルタイムの貸出情報を提供した影響と考えられる。今後も生活交通手段として利用が増えると予想される。","grammar":"A에서 B로 증가했다 / A는 늘어난 반면 B는 줄었다 / 이는 ~한 영향으로 보인다 / ~할 것으로 예상된다","vocab":"이용 건수=利用件数 / 출퇴근=通勤・通学 / 비율=割合 / 반면=一方 / 확대되다=拡大する / 교통 수단=交通手段","target":"200~300자, 제목 없이 자료를 비교·분석하세요.","min":200,"max":300},{"id":54,"section":"writing","categoryKo":"쓰기 54번","categoryJa":"作文 54番","stem":"짧은 영상과 요약 서비스가 발달하면서 필요한 정보를 빠르게 얻는 일이 쉬워졌다. 그러나 내용을 충분히 이해하지 않은 채 핵심만 소비하는 습관이 사고의 깊이를 약화시킬 수 있다는 우려도 있다. 아래의 내용을 중심으로 ‘빠른 정보 소비와 깊이 있는 이해’에 대한 자신의 생각을 쓰십시오.\n\n• 짧고 요약된 정보의 이용이 늘어난 이유는 무엇인가?\n• 빠른 정보 소비의 장점과 문제점은 무엇인가?\n• 깊이 있는 이해를 위해 어떤 태도와 노력이 필요한가?","model":"최근 짧은 영상과 요약 서비스가 널리 사용되면서 사람들은 필요한 정보를 매우 빠르게 얻을 수 있게 되었다. 바쁜 생활 속에서 긴 글이나 영상을 모두 확인하기 어렵고, 개인에게 맞는 내용을 추천해 주는 기술도 발달했기 때문이다.\n\n빠른 정보 소비에는 분명한 장점이 있다. 짧은 시간 안에 여러 주제를 접할 수 있고, 관심 있는 분야를 찾는 데에도 도움이 된다. 그러나 핵심만 반복해서 접하면 정보가 만들어진 배경이나 서로 다른 관점을 놓치기 쉽다. 또한 내용을 충분히 검토하지 않은 채 사실이라고 믿으면 잘못된 정보에 영향을 받을 가능성도 커진다. 결국 많이 아는 것처럼 느끼지만 실제로는 깊이 이해하지 못하는 문제가 생길 수 있다.\n\n따라서 정보를 효율적으로 이용하면서도 깊이 있는 이해를 위한 습관을 함께 길러야 한다. 먼저 중요한 내용은 원문이나 신뢰할 수 있는 여러 자료를 통해 다시 확인할 필요가 있다. 또한 요약을 결론으로 받아들이기보다 더 알아보기 위한 출발점으로 활용해야 한다. 무엇보다 자신의 생각과 다른 의견도 읽고 왜 그런 차이가 생겼는지 따져 보는 태도가 중요하다. 빠르게 정보를 얻는 능력과 천천히 판단하는 능력이 함께 갖추어질 때 정보 기술의 장점을 제대로 활용할 수 있을 것이다.","jp":"近年、短い動画や要約サービスが広く使われるようになり、人々は必要な情報を非常に速く得られるようになりました。忙しい生活の中で長い文章や動画をすべて確認するのは難しく、個人に合った内容を推薦する技術も発達したためです。速い情報消費には長所がありますが、要点だけを受け取ると背景や異なる観点を見落とし、誤情報の影響を受ける可能性も高まります。重要な内容は原文や複数の信頼できる資料で再確認し、要約を結論ではなく追加調査の出発点として使う姿勢が重要です。","grammar":"-기 때문이다 / -는 데 도움이 되다 / -는 반면(에) / -지 않은 채 / -을 가능성이 커지다 / -기보다 / -을 필요가 있다","vocab":"요약 서비스=要約サービス / 사고의 깊이=思考の深さ / 관점=観点 / 검토하다=検討する / 잘못된 정보=誤情報 / 출발점=出発点 / 따져 보다=吟味する","target":"600~700자. 제시된 3개 과제를 모두 다루세요.","min":600,"max":700}];
const LS=[{"id":1,"section":"listening","prompt":"다음 내용을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","choices":["①","②","③","④"],"image":"listening_q1.webp","script":"여자: 이 상자 안에는 유리컵이 들어 있어요. 깨지지 않게 조심해서 옮겨 주세요.\n남자: 네, 상자에 취급 주의 표시도 붙여 드리겠습니다.","answer":"①","answerIndex":0,"playCount":1,"instruction":"※ [1~3] 다음을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","recommendedSec":55,"scriptJa":"女：この箱の中にはガラスのコップが入っています。割れないように気をつけて運んでください。\n男：はい、箱に「取扱注意」の表示も付けておきます。"},{"id":2,"section":"listening","prompt":"다음 내용을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","choices":["①","②","③","④"],"image":"listening_q2.webp","script":"여자: 창가 자리는 햇빛이 너무 강해서 화면이 잘 안 보여요.\n남자: 그럼 커튼을 치고 책상 위 조명만 켤게요.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [1~3] 다음을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","recommendedSec":55,"scriptJa":"女：窓際の席は日差しが強すぎて、画面がよく見えません。\n男：では、カーテンを閉めて、机の上の照明だけをつけますね。"},{"id":3,"section":"listening","prompt":"다음 내용을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","choices":["①","②","③","④"],"image":"listening_q3.webp","script":"여자(설명): 시민들의 자전거 이용 목적을 조사했습니다. 출퇴근이 40%로 가장 높았고, 운동이 30%, 여가가 20%, 장보기가 10% 순이었습니다.","answer":"②","answerIndex":1,"playCount":1,"instruction":"※ [1~3] 다음을 듣고 가장 알맞은 그림 또는 그래프를 고르십시오.","recommendedSec":55,"scriptJa":"女（説明）：市民の自転車利用目的を調査しました。通勤・通学が40％で最も高く、運動30％、余暇20％、買い物10％の順でした。"},{"id":4,"section":"listening","prompt":"","choices":["① 아직 표를 다 보지 못했어요.","② 발표 날짜를 다음 주로 미룰까요?","③ 그럼 표는 제가 만들어 드릴게요.","④ 내용부터 다시 정리해야겠네요."],"script":"여자: 다음 주 발표 자료, 오늘까지 다 만들 수 있겠어요?\n남자: 내용은 다 정리했는데 표를 아직 못 넣었어요.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [4~8] 다음을 듣고 이어질 수 있는 말로 가장 알맞은 것을 고르십시오.","recommendedSec":48,"promptJa":"","choicesJa":["① まだ表を全部見られていません。","② 発表日を来週に延期しましょうか。","③ では、表は私が作ります。","④ まず内容から整理し直さないといけませんね。"],"scriptJa":"女：来週の発表資料、今日までに全部作れそうですか。\n男：内容は全部整理しましたが、まだ表を入れられていません。"},{"id":5,"section":"listening","prompt":"","choices":["① 수영을 배우는 데 오래 걸렸어요.","② 평일 저녁에는 좀 한가하대요.","③ 주말에 같이 수영하러 갔었어요.","④ 새 수영장은 집에서 너무 멀어요."],"script":"남자: 새로 생긴 수영장에 가 봤어요?\n여자: 아니요. 주말마다 사람이 너무 많다고 해서요.","answer":"②","answerIndex":1,"playCount":1,"instruction":"※ [4~8] 다음을 듣고 이어질 수 있는 말로 가장 알맞은 것을 고르십시오.","recommendedSec":48,"promptJa":"","choicesJa":["① 泳げるようになるまで時間がかかりました。","② 平日の夜は少し空いているそうです。","③ 週末に一緒に泳ぎに行きました。","④ 新しいプールは家から遠すぎます。"],"scriptJa":"男：新しくできたプールに行ってみましたか。\n女：いいえ。週末はいつも人が多すぎると聞いたので。"},{"id":6,"section":"listening","prompt":"","choices":["① 주소를 바꾸면 택배를 못 받겠네.","② 오늘은 택배가 오지 않을 것 같아.","③ 배송비를 먼저 확인해 봐야겠어.","④ 기사님께 위치를 자세히 알려 드려야겠어."],"script":"여자: 택배가 오늘 도착한다더니 아직 안 왔네.\n남자: 배송 조회를 해 보니까 기사님이 주소를 못 찾고 있대.","answer":"④","answerIndex":3,"playCount":1,"instruction":"※ [4~8] 다음을 듣고 이어질 수 있는 말로 가장 알맞은 것을 고르십시오.","recommendedSec":48,"promptJa":"","choicesJa":["① 住所を変えたら宅配便を受け取れないな。","② 今日は宅配便が来なさそうだ。","③ まず送料を確認しないと。","④ 配達員さんに場所を詳しく伝えないと。"],"scriptJa":"女：宅配便が今日届くと言っていたのに、まだ来ないね。\n男：配送状況を確認したら、配達員さんが住所を見つけられないそうだよ。"},{"id":7,"section":"listening","prompt":"","choices":["① 다행이네요. 바로 들어갈 수 있겠어요.","② 그래요? 음식이 늦게 나와서 걱정이네요.","③ 그럼 다른 식당을 예약하는 게 좋겠어요.","④ 어제는 예약할 시간이 없었나 봐요."],"script":"남자: 이 식당은 예약을 안 하면 오래 기다려야 한다던데요.\n여자: 걱정 마세요. 제가 어제 미리 해 뒀어요.","answer":"①","answerIndex":0,"playCount":1,"instruction":"※ [4~8] 다음을 듣고 이어질 수 있는 말로 가장 알맞은 것을 고르십시오.","recommendedSec":48,"promptJa":"","choicesJa":["① よかったですね。すぐに入れそうです。","② そうですか。料理が遅く出てきそうで心配ですね。","③ では、別の店を予約したほうがよさそうです。","④ 昨日は予約する時間がなかったみたいですね。"],"scriptJa":"男：この店は予約しないと長く待つそうですよ。\n女：心配しないでください。昨日あらかじめ予約しておきました。"},{"id":8,"section":"listening","prompt":"","choices":["① 보고서를 내일까지 제출해야 해요.","② 같은 내용을 두 번 쓰는 게 더 좋아요.","③ 다시 읽어 보고 중복된 부분을 지울게요.","④ 수정한 내용이 어디에 있는지 모르겠어요."],"script":"여자: 보고서에 같은 내용이 두 번 들어가 있어요.\n남자: 아, 수정하면서 확인을 못 했나 봐요.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [4~8] 다음을 듣고 이어질 수 있는 말로 가장 알맞은 것을 고르십시오.","recommendedSec":48,"promptJa":"","choicesJa":["① 報告書を明日までに提出しなければなりません。","② 同じ内容を2回書くほうがいいです。","③ もう一度読んで、重複した部分を削除します。","④ 修正した内容がどこにあるのか分かりません。"],"scriptJa":"女：報告書に同じ内容が2回入っています。\n男：あ、修正しながら確認できなかったみたいです。"},{"id":9,"section":"listening","prompt":"","choices":["① 우유가 든 음료를 주문한다.","② 메뉴판을 다시 가져온다.","③ 남자에게 음료를 추천한다.","④ 음료를 두유로 바꿔 달라고 한다."],"script":"여자: 이 음료를 마시고 싶은데 우유가 들어가네요.\n남자: 주문할 때 말씀하시면 두유로 바꿀 수 있어요.\n여자: 그래요? 그럼 이걸로 할게요.","answer":"④","answerIndex":3,"playCount":1,"instruction":"※ [9~12] 다음을 듣고 여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.","recommendedSec":55,"promptJa":"","choicesJa":["① 牛乳入りの飲み物を注文する。","② メニューをもう一度持ってくる。","③ 男性に飲み物を勧める。","④ 飲み物を豆乳に変更してほしいと頼む。"],"scriptJa":"女：この飲み物を飲みたいのですが、牛乳が入っていますね。\n男：注文するときに言えば、豆乳に変更できます。\n女：そうですか。では、これにします。"},{"id":10,"section":"listening","prompt":"","choices":["① 새 종이를 가져온다.","② 용지함을 제대로 닫았는지 확인한다.","③ 인쇄한 문서를 다시 작성한다.","④ 수리 기사에게 전화를 건다."],"script":"여자: 인쇄가 자꾸 한쪽으로 기울어져 나오네요.\n남자: 용지함이 제대로 닫혀 있는지 먼저 확인해 보세요.\n여자: 알겠습니다. 지금 볼게요.","answer":"②","answerIndex":1,"playCount":1,"instruction":"※ [9~12] 다음을 듣고 여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.","recommendedSec":55,"promptJa":"","choicesJa":["① 新しい紙を持ってくる。","② 用紙トレイがきちんと閉まっているか確認する。","③ 印刷した文書をもう一度作成する。","④ 修理業者に電話する。"],"scriptJa":"女：印刷すると、いつも片側に傾いて出てきますね。\n男：まず用紙トレイがきちんと閉まっているか確認してください。\n女：分かりました。今見てみます。"},{"id":11,"section":"listening","prompt":"","choices":["① 승차권 변경 창구로 간다.","② 출발 시간을 다시 확인한다.","③ 남자에게 표를 대신 바꿔 달라고 한다.","④ 다음 열차의 좌석을 인터넷으로 찾는다."],"script":"남자: 표를 바꾸려면 출발 20분 전까지 창구로 가야 해요.\n여자: 지금 30분 남았으니까 바로 다녀올게요.","answer":"①","answerIndex":0,"playCount":1,"instruction":"※ [9~12] 다음을 듣고 여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.","recommendedSec":55,"promptJa":"","choicesJa":["① 乗車券変更窓口へ行く。","② 出発時刻をもう一度確認する。","③ 男性に代わりに切符を変更してもらう。","④ 次の列車の座席をインターネットで探す。"],"scriptJa":"男：切符を変更するには、出発20分前までに窓口へ行かなければなりません。\n女：今30分残っているので、すぐ行ってきます。"},{"id":12,"section":"listening","prompt":"","choices":["① 강연 순서를 바꾼다.","② 음료를 사러 밖으로 나간다.","③ 강연자를 대기실로 안내한다.","④ 참가자들에게 도착 시간을 알린다."],"script":"남자: 강연자께서 예상보다 일찍 도착하셨대요.\n여자: 그럼 대기실로 안내해 드리고 음료도 준비해야겠네요.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [9~12] 다음을 듣고 여자가 이어서 할 행동으로 가장 알맞은 것을 고르십시오.","recommendedSec":55,"promptJa":"","choicesJa":["① 講演の順番を変更する。","② 飲み物を買いに外へ出る。","③ 講演者を控室へ案内する。","④ 参加者に到着時刻を知らせる。"],"scriptJa":"男：講演者が予定より早く到着されたそうです。\n女：では、控室へご案内して、飲み物も準備しないといけませんね。"},{"id":13,"section":"listening","prompt":"","choices":["① 시장은 주말에만 문을 연다.","② 시장은 수요일에도 문을 연다.","③ 시장은 지난달부터 월요일에도 문을 연다.","④ 여자는 이 시장에 여러 번 와 본 적이 있다."],"script":"여자: 이 시장은 주말에만 여는 줄 알았어요.\n남자: 원래는 그랬는데 지난달부터 수요일에도 문을 열어요. 대신 월요일은 쉬고요.","answer":"②","answerIndex":1,"playCount":1,"instruction":"※ [13~16] 다음을 듣고 들은 내용과 같은 것을 고르십시오.","recommendedSec":60,"promptJa":"","choicesJa":["① 市場は週末だけ開く。","② 市場は水曜日にも開く。","③ 市場は先月から月曜日にも開く。","④ 女性はこの市場に何度も来たことがある。"],"scriptJa":"女：この市場は週末だけ開くと思っていました。\n男：以前はそうでしたが、先月から水曜日にも開きます。その代わり月曜日は休みです。"},{"id":14,"section":"listening","prompt":"","choices":["① 2층 자료실은 하루 종일 문을 닫는다.","② 전기 점검은 오전에 진행된다.","③ 책은 점검이 끝난 뒤에만 반납할 수 있다.","④ 점검 시간에는 1층 열람실을 이용할 수 있다."],"script":"여자(안내): 오늘 오후 3시부터 5시까지 2층 자료실에서 전기 점검을 실시합니다. 이 시간에는 2층 자료실을 이용할 수 없으니 1층 열람실을 이용해 주시기 바랍니다. 1층 반납함은 정상적으로 이용할 수 있습니다.","answer":"④","answerIndex":3,"playCount":1,"instruction":"※ [13~16] 다음을 듣고 들은 내용과 같은 것을 고르십시오.","recommendedSec":60,"promptJa":"","choicesJa":["① 2階資料室は一日中閉まる。","② 電気点検は午前中に行われる。","③ 本は点検終了後にだけ返却できる。","④ 点検時間中は1階閲覧室を利用できる。"],"scriptJa":"女（案内）：本日午後3時から5時まで、2階資料室で電気点検を実施します。この時間は2階資料室を利用できませんので、1階閲覧室をご利用ください。1階返却ボックスは通常どおり利用できます。"},{"id":15,"section":"listening","prompt":"","choices":["① 사고로 다친 사람이 여러 명 있다.","② 산책로 전체가 영구적으로 폐쇄된다.","③ 구청은 무너진 산책로를 복구할 예정이다.","④ 폭우는 오늘 아침부터 내리기 시작했다."],"script":"남자(뉴스): 어젯밤 내린 폭우로 강변 산책로 일부가 무너졌습니다. 다행히 인명 피해는 없었습니다. 구청은 안전을 위해 앞으로 일주일 동안 해당 구간의 출입을 통제하고 복구 작업을 진행할 예정입니다.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [13~16] 다음을 듣고 들은 내용과 같은 것을 고르십시오.","recommendedSec":60,"promptJa":"","choicesJa":["① 事故でけがをした人が数人いる。","② 散歩道全体が永久に閉鎖される。","③ 区役所は崩れた散歩道を復旧する予定だ。","④ 豪雨は今日の朝から降り始めた。"],"scriptJa":"男（ニュース）：昨夜の豪雨で川沿いの散歩道の一部が崩れました。幸い人的被害はありませんでした。区役所は安全のため、今後1週間、該当区間への立ち入りを規制し、復旧作業を行う予定です。"},{"id":16,"section":"listening","prompt":"","choices":["① 여자는 보호자의 집에서 동물의 행동을 관찰한다.","② 여자는 동물의 병을 진단하고 약을 처방한다.","③ 여자는 주로 동물병원의 수술을 돕는다.","④ 여자의 직업은 동물의 먹이를 개발하는 일이다."],"script":"남자: 반려동물 행동 상담사는 어떤 일을 합니까?\n여자: 먼저 보호자의 집을 방문해 동물이 평소에 어떻게 행동하는지 관찰합니다. 보호자와 상담한 뒤 생활 습관을 바꿀 계획도 세우고요. 병을 진단하거나 약을 처방하는 일은 수의사가 합니다.","answer":"①","answerIndex":0,"playCount":1,"instruction":"※ [13~16] 다음을 듣고 들은 내용과 같은 것을 고르십시오.","recommendedSec":60,"promptJa":"","choicesJa":["① 女性は飼い主の家で動物の行動を観察する。","② 女性は動物の病気を診断して薬を処方する。","③ 女性は主に動物病院の手術を手伝う。","④ 女性の仕事は動物の餌を開発することだ。"],"scriptJa":"男：ペット行動カウンセラーはどのような仕事をしますか。\n女：まず飼い主の家を訪問し、動物が普段どのように行動するかを観察します。飼い主と相談した後、生活習慣を変える計画も立てます。病気を診断したり薬を処方したりするのは獣医師の仕事です。"},{"id":17,"section":"listening","prompt":"","choices":["① 남은 음식은 모두 냉동 보관해야 한다.","② 음식은 먹을 만큼만 준비하는 것이 좋다.","③ 반찬은 한 번에 많이 만들어야 편리하다.","④ 음식물 쓰레기는 분리해서 버리는 것이 중요하다."],"script":"여자: 반찬을 매번 많이 만들어서 결국 버리게 돼.\n남자: 그러니까 처음부터 먹을 만큼만 준비하는 게 좋아. 남은 재료가 있으면 다른 요리에 활용할 수도 있고.","answer":"②","answerIndex":1,"playCount":1,"instruction":"※ [17~20] 다음을 듣고 남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","recommendedSec":65,"promptJa":"","choicesJa":["① 残った料理はすべて冷凍保存しなければならない。","② 料理は食べる分だけ準備するのがよい。","③ おかずは一度にたくさん作るほうが便利だ。","④ 生ごみは分別して捨てることが重要だ。"],"scriptJa":"女：毎回おかずをたくさん作って、結局捨てることになるの。\n男：だから最初から食べる分だけ準備したほうがいいよ。残った材料があれば、ほかの料理にも使えるし。"},{"id":18,"section":"listening","prompt":"","choices":["① 팀장은 모든 결정을 혼자 내려야 한다.","② 의견이 없는 팀원은 회의에서 제외해야 한다.","③ 결과를 빨리 내려면 회의 시간을 줄여야 한다.","④ 팀원들에게 자신의 생각을 말할 기회를 줘야 한다."],"script":"여자: 팀원들이 의견을 잘 안 내서 결국 제가 다 정하게 돼요.\n남자: 시간이 조금 걸리더라도 각자 생각을 말할 기회를 줘야 해요. 그래야 결과도 더 좋아집니다.","answer":"④","answerIndex":3,"playCount":1,"instruction":"※ [17~20] 다음을 듣고 남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","recommendedSec":65,"promptJa":"","choicesJa":["① チーム長はすべての決定を一人で下すべきだ。","② 意見のないメンバーは会議から外すべきだ。","③ 結論を早く出すには会議時間を短くすべきだ。","④ メンバーに自分の考えを話す機会を与えるべきだ。"],"scriptJa":"女：チームのメンバーがあまり意見を出さないので、結局私が全部決めることになります。\n男：少し時間がかかっても、それぞれが考えを話す機会を与えるべきです。そうすれば結果もより良くなります。"},{"id":19,"section":"listening","prompt":"","choices":["① 여행 일정은 여유롭게 짜는 것이 좋다.","② 여행에서는 유명한 곳을 모두 봐야 한다.","③ 여행을 가기 전에 체력을 길러야 한다.","④ 여행의 만족도는 방문한 장소의 수에 달려 있다."],"script":"여자: 여행 갈 때 유명한 곳은 전부 봐야 마음이 놓여요.\n남자: 일정이 너무 빡빡하면 기억에 남는 건 피곤함뿐이에요. 몇 곳만 골라 천천히 보는 게 낫죠.","answer":"①","answerIndex":0,"playCount":1,"instruction":"※ [17~20] 다음을 듣고 남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","recommendedSec":65,"promptJa":"","choicesJa":["① 旅行の日程は余裕を持って組むのがよい。","② 旅行では有名な場所をすべて見なければならない。","③ 旅行前に体力をつけなければならない。","④ 旅行の満足度は訪れた場所の数で決まる。"],"scriptJa":"女：旅行に行くとき、有名な場所は全部見ないと安心できません。\n男：日程が詰まりすぎると、記憶に残るのは疲れだけです。何か所か選んでゆっくり見るほうがいいですよ。"},{"id":20,"section":"listening","prompt":"","choices":["① 상품은 후기 수가 많을수록 품질이 좋다.","② 부정적인 후기는 믿지 않는 것이 좋다.","③ 상품 후기는 내용과 작성 시점을 함께 봐야 한다.","④ 후기보다 광고의 정보를 먼저 확인해야 한다."],"script":"여자: 후기 숫자가 많으면 좋은 상품이라고 봐도 되겠죠?\n남자: 숫자만 보면 안 돼요. 최근에 쓴 후기인지, 실제 사용 경험이 구체적으로 적혀 있는지도 같이 확인해야 합니다.","answer":"③","answerIndex":2,"playCount":1,"instruction":"※ [17~20] 다음을 듣고 남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","recommendedSec":65,"promptJa":"","choicesJa":["① 商品はレビュー数が多いほど品質がよい。","② 否定的なレビューは信じないほうがよい。","③ 商品レビューは内容と投稿時期を一緒に確認すべきだ。","④ レビューより広告の情報を先に確認すべきだ。"],"scriptJa":"女：レビューの数が多ければ、良い商品だと考えてもいいですよね。\n男：数だけ見てはいけません。最近書かれたレビューか、実際の使用経験が具体的に書かれているかも一緒に確認する必要があります。"},{"id":21,"section":"listening","prompt":"남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","choices":["① 설명회 참석 인원을 미리 줄여야 한다.","② 어르신에게는 모든 자료를 종이로 제공해야 한다.","③ 발표 자료는 행사 전날까지 완성해야 한다.","④ 인쇄물은 필요한 사람을 중심으로 제공하는 것이 좋다."],"script":"여자: 내일 주민 설명회 자료는 모두 준비됐어요. 참석자가 80명이라서 80부를 출력해 뒀습니다.\n남자: 그런데 발표 직전까지 내용이 바뀔 수도 있는데 미리 전부 인쇄하면 종이가 낭비되지 않을까요?\n여자: 화면으로만 보여 드리면 어르신들이 불편해하실 것 같아서요.\n남자: 핵심 자료만 20부 정도 준비하고, 나머지는 화면과 QR 코드로 제공하는 게 어떨까요? 인쇄물이 꼭 필요한 분께만 추가로 드리면 되고요.\n여자: 그게 좋겠네요. 수정할 내용이 생겨도 대응하기 쉽겠어요.","answer":"④","answerIndex":3,"playCount":2,"instruction":"※ [21~22] 다음을 듣고 물음에 답하십시오.","recommendedSec":65,"promptJa":"男性の中心的な考えとして最も適切なものを選びなさい。","choicesJa":["① 説明会の参加人数をあらかじめ減らすべきだ。","② 高齢者にはすべての資料を紙で提供すべきだ。","③ 発表資料は行事の前日までに完成させるべきだ。","④ 印刷物は必要な人を中心に提供するのがよい。"]},{"id":22,"section":"listening","prompt":"들은 내용과 같은 것을 고르십시오.","choices":["① 여자는 아직 자료를 인쇄하지 않았다.","② 발표 자료의 내용은 바뀔 가능성이 있다.","③ 남자는 자료를 80부 더 출력하자고 했다.","④ 설명회에서는 화면을 사용할 수 없다."],"script":"여자: 내일 주민 설명회 자료는 모두 준비됐어요. 참석자가 80명이라서 80부를 출력해 뒀습니다.\n남자: 그런데 발표 직전까지 내용이 바뀔 수도 있는데 미리 전부 인쇄하면 종이가 낭비되지 않을까요?\n여자: 화면으로만 보여 드리면 어르신들이 불편해하실 것 같아서요.\n남자: 핵심 자료만 20부 정도 준비하고, 나머지는 화면과 QR 코드로 제공하는 게 어떨까요? 인쇄물이 꼭 필요한 분께만 추가로 드리면 되고요.\n여자: 그게 좋겠네요. 수정할 내용이 생겨도 대응하기 쉽겠어요.","answer":"②","answerIndex":1,"playCount":2,"instruction":"※ [21~22] 다음을 듣고 물음에 답하십시오.","recommendedSec":65,"promptJa":"聞いた内容と一致するものを選びなさい。","choicesJa":["① 女性はまだ資料を印刷していない。","② 発表資料の内容は変わる可能性がある。","③ 男性は資料をさらに80部印刷しようと言った。","④ 説明会では画面を使用できない。"]},{"id":23,"section":"listening","prompt":"남자는 무엇을 하고 있는지 고르십시오.","choices":["① 제품의 수리 비용을 확인하고 있다.","② 제품을 사용할 장소를 예약하고 있다.","③ 이미 산 제품의 환불 방법을 묻고 있다.","④ 원하는 조건에 맞는 제품이 있는지 알아보고 있다."],"script":"남자: 안녕하세요. 작은 작업실에 둘 공기청정기를 찾고 있는데요. 소음이 적고 필터 교체 시기를 알려 주는 제품이 있습니까?\n여자: 네, 이 제품은 조용한 모드가 있고 필터를 바꿀 때가 되면 화면에 표시가 나옵니다.\n남자: 작업실이 20제곱미터 정도인데 충분할까요?\n여자: 30제곱미터까지 사용할 수 있습니다. 또 밤에는 화면 불빛을 끌 수도 있어요.\n남자: 필터는 자주 바꿔야 하나요?\n여자: 보통 하루 여덟 시간 사용하면 1년에 한 번 정도 교체하시면 됩니다.","answer":"④","answerIndex":3,"playCount":2,"instruction":"※ [23~24] 다음을 듣고 물음에 답하십시오.","recommendedSec":66,"promptJa":"男性が何をしているのか選びなさい。","choicesJa":["① 製品の修理費用を確認している。","② 製品を使用する場所を予約している。","③ すでに購入した製品の返品方法を尋ねている。","④ 希望条件に合う製品があるか調べている。"]},{"id":24,"section":"listening","prompt":"들은 내용과 같은 것을 고르십시오.","choices":["① 제품의 화면 불빛은 끌 수 있다.","② 제품은 20제곱미터까지만 사용할 수 있다.","③ 필터는 한 달에 한 번 교체해야 한다.","④ 조용한 모드에서는 필터 알림이 작동하지 않는다."],"script":"남자: 안녕하세요. 작은 작업실에 둘 공기청정기를 찾고 있는데요. 소음이 적고 필터 교체 시기를 알려 주는 제품이 있습니까?\n여자: 네, 이 제품은 조용한 모드가 있고 필터를 바꿀 때가 되면 화면에 표시가 나옵니다.\n남자: 작업실이 20제곱미터 정도인데 충분할까요?\n여자: 30제곱미터까지 사용할 수 있습니다. 또 밤에는 화면 불빛을 끌 수도 있어요.\n남자: 필터는 자주 바꿔야 하나요?\n여자: 보통 하루 여덟 시간 사용하면 1년에 한 번 정도 교체하시면 됩니다.","answer":"①","answerIndex":0,"playCount":2,"instruction":"※ [23~24] 다음을 듣고 물음에 답하십시오.","recommendedSec":66,"promptJa":"聞いた内容と一致するものを選びなさい。","choicesJa":["① 製品の画面の明かりは消すことができる。","② 製品は20平方メートルまでしか使用できない。","③ フィルターは1か月に1回交換しなければならない。","④ 静音モードではフィルター通知が作動しない。"]},{"id":25,"section":"listening","prompt":"남자의 중심 생각으로 가장 알맞은 것을 고르십시오.","choices":["① 축제의 성공을 위해 유명 るものを選びなさい。","choicesJa":["① 人工知能は原本資料がなくても完全に修復する。","② 人工知能の結果は専門家が確認して修正しなければならない。","③ 人工知能を使用すると修復時間がさらに長くなる。","④ 人工知能は映像ノイズの低減に使用できない。"]},{"id":41,"section":"listening","prompt":"이 강연의 중심 내용으로 가장 알맞은 것을 고르십시오.","choices":["① 제조업체는 제품 가격을 낮추는 데만 집중해야 한다.","② 제품 판매 이후에는 고객과의 관계가 중요하지 않다.","③ 센서를 사용하면 모든 부품을 교체할 필요가 없다.","④ 제조업은 제품과 서비스를 결합해 새로운 성장을 만들 수 있다."],"script":"남자(강연): 제조업체는 전통적으로 제품을 만들어 판매하는 데 집중해 왔습니다. 그러나 최근에는 제품을 판매한 뒤 제공하는 서비스가 새로운 성장 동력이 되고 있습니다. 한 승강기 회사는 승강기에 센서를 달아 작동 상태를 실시간으로 확인하고, 고장이 나기 전에 부품을 교체해 주는 서비스를 시작했습니다. 고객은 갑작스러운 운행 중단을 줄일 수 있고, 회사는 정기적인 관리 수입을 얻습니다. 또한 서비스 과정에서 모인 고장 자료는 다음 제품을 설계하는 데 활용됩니다. 이처럼 제조업은 제품과 서비스를 결합함으로써 고객과의 관계를 오래 유지하고 새로운 수익을 만들 수 있습니다.","answer":"④","answerIndex":3,"playCount":2,"instruction":"※ [41~42] 다음을 듣고 물음에 답하십시오.","recommendedSec":80,"promptJa":"この講演の中心的な内容として最も適切なものを選びなさい。","choicesJa":["① 製造業者は製品価格を下げることだけに集中すべきだ。","② 製品販売後は顧客との関係は重要ではない。","③ センサーを使えばすべての部品を交換する必要はない。","④ 製造業は製品とサービスを組み合わせ、新しい成長を生み出せる。"]},{"id":42,"section":"listening","prompt":"들은 내용과 같은 것을 고르십시오.","choices":["① 승강기 회사는 고장 전에 부품을 교체하는 서비스를 제공한다.","② 회사는 서비스 때문에 정기적인 수입을 잃었다.","③ 고장 자료는 제품 설계에 활용되지 않는다.","④ 고객은 센서 설치 후 운행 중단을 더 자주 경험했다."],"script":"남자(강연): 제조업체는 전통적으로 제품을 만들어 판매하는 데 집중해 왔습니다. 그러나 최근에는 제품을 판매한 뒤 제공하는 서비스가 새로운 성장 동력이 되고 있습니다. 한 승강기 회사는 승강기에 센서를 달아 작동 상태를 실시간으로 확인하고, 고장이 나기 전에 부품을 교체해 주는 서비스를 시작했습니다. 고객은 갑작스러운 운행 중단을 줄일 수 있고, 회사는 정기적인 관리 수입을 얻습니다. 또한 서비스 과정에서 모인 고장 자료는 다음 제품을 설계하는 데 활용됩니다. 이처럼 제조업은 제품과 서비스를 결합함으로써 고객과의 관계를 오래 유지하고 새로운 수익을 만들 수 있습니다.","answer":"①","answerIndex":0,"playCount":2,"instruction":"※ [41~42] 다음을 듣고 물음에 답하십시오.","recommendedSec":80,"promptJa":"聞いた内容と一致するものを選びなさい。","choicesJa":["① エレベーター会社は故障前に部品を交換するサービスを提供する。","② 会社はサービスのため定期収入を失った。","③ 故障データは製品設計に活用されない。","④ 顧客はセンサー設置後、運転停止をより頻繁に経験した。"]},{"id":43,"section":"listening","prompt":"무엇에 대한 내용인지 가장 알맞은 것을 고르십시오.","choices":["① 제주 돌담을 관광 상품으로 개발한 과정","② 제주 돌담에 사용되는 돌의 생산 지역","③ 제주 돌담이 강한 바람을 견디는 구조적 원리","④ 제주 돌담을 현대식 건물로 바꾸는 방법"],"script":"남자(다큐멘터리): 제주도의 전통 pt":"여자: 일부 지방자치단체가 공공도서관을 밤 12시까지 운영하는 방안을 검토하고 있습니다. 이용자에게는 반가운 소식 아닙니까?\n남자: 늦은 시간에 공부하거나 일하는 시민에게는 도움이 될 겁니다. 하지만 모든 도서관의 운영 시간을 똑같이 늘리는 방식은 효율적이지 않습니다.\n여자: 지역별 수요가 다르기 때문인가요?\n남자: 그렇습니다. 이용자가 많은 거점 도서관을 먼저 선정하고, 야간 교통편과 직원 안전 대책을 함께 마련해야 합니다. 세 달 정도 시범 운영하면서 실제 이용자 수와 비용을 확인한 뒤 확대 여부를 결정하는 것이 현실적입니다.\n여자: 심야 운영 자체에 반대하시는 건 아니군요.\n남자: 네. 필요성은 인정하지만, 수요와 안전을 반영한 단계적 시행이 필요하다는 뜻입니다.","answer":"④","answerIndex":3,"playCount":2,"instruction":"※ [47~48] 다음을 듣고 물음에 답하십시오.","recommendedSec":84,"promptJa":"男性の態度として最も適切なものを選びなさい。","choicesJa":["① 深夜運営の必要性を完全に否定している。","② 地方自治体の決定を無条件に支持している。","③ 職員が夜間勤務を拒否すると批判している。","④ 条件を検討した段階的な実施方法を提案している。"]},{"id":49,"section":"listening","prompt":"들은 내용과 같은 것을 고르십시오.","choices":["① 개인정보를 사용하지 않으면 알고리즘은 항상 공정하다.","② 개인정보를 제외해도 과거 선택 기록에 사회적 차이가 반영될 수 있다.","③ 모든 사람에게 같은 정보를 보여 주는 것이 가장 공정하다.","④ 사용자는 추천 기준을 알 필요가 없다."],"script":"남자(강연): 추천 알고리즘의 공정성을 평가할 때 흔히 민감한 개인정보를 사용하지 않으면 공정하다고 생각합니다. 그러나 성별이나 나이를 입력하지 않아도 과거의 선택 기록이 사회적 차이를 그대로 반영할 수 있습니다. 또한 모든 사람에게 같은 콘텐츠를 보여 주는 것도 반드시 공정한 것은 아닙니다. 출발 조건과 필요한 정보가 서로 다르기 때문입니다. 따라서 알고리즘의 공정성은 어떤 정보를 사용했는지만 볼 것이 아니라, 누구에게 어떤 선택의 기회를 주거나 제한했는지까지 살펴야 합니다. 사용자가 추천 기준을 이해하고 원하지 않는 추천에서 벗어날 수 있는 장치도 필요합니다. 공정성을 하나의 간단한 규칙으로 판단하면 오히려 보이지 않는 차별을 놓칠 수 있습니다.","answer":"②","answerIndex":1,"playCount":2,"instruction":"※ [49~50] 다음을 듣고 물음에 답하십시오.","recommendedSec":86,"promptJa":"聞いた内容と一致するものを選びなさい。","choicesJa":["① 個人情報を使わなければアルゴリズムは常に公平だ。","② 個人情報を除いても、過去の選択記録に社会的な差が反映されることがある。","③ すべての人に同じ情報を見せることが最も公平だ。","④ 利用者は推薦基準を知る必要がない。"]},{"id":50,"section":"listening","prompt":"남자의 태도로 가장 알맞은 것을 고르십시오.","choices":["① 추천 알고리즘의 사용을 즉시 금지해야 한다고 주장하고 있다.","② 알고리즘의 정확도가 공정성보다 항상 중요하다고 강조하고 있다.","③ 공정성을 단순한 기준으로 판단하는 것을 경계하고 있다.","④ 개인정보를 더 많이 수집해야 한다고 제안하고 있다."],"script":"남자(강연): 추천 알고리즘의 공정성을 평가할 때 흔히 민감한 개인정보를 사용하지 않으면 공정하다고 생각합니다. 그러나 성별이나 나이를 입력하지 않아도 과거의 선택 기록이 사회적 차이를 그대로 반영할 수 있습니다. 또한 모든 사람에게 같은 콘텐츠를 보여 주는 것도 반드시 공정한 것은 아닙니다. 출발 조건과 필요한 정보가 서로 다르기 때문입니다. 따라서 알고리즘의 공정성은 어떤 정보를 사용했는지만 볼 것이 아니라, 누구에게 어떤 선택의 기회를 async function playListening(id,real){if(speechBusy)return;if(real){S.real.audioPlayed=S.real.audioPlayed||{};if(S.real.audioPlayed[id])return;S.real.audioPlayed[id]=true;save()}stopListeningAudio();let requestToken=++audioFallbackToken;speechBusy=true,q=!real&&S.infinity?.current?.bankId?infinityCurrentQuestion():LS[id-1],btn=$('audioBtn'),src=$('audioSource');if(btn){btn.classList.add('playing');btn.innerHTML='<span class="audioPlayingDot"></span>'+ml('재생 중…','再生中…','Playing…','播放中…')}let file=q?.bankId?null:await findRecordedAudio(id);if(requestToken!==audioFallbackToken)return;if(file){if(src)src.textContent='🎙 RECORDED AUDIO';let a=new Audio(file);activeAudio=a;a.onended=()=>audioDone(btn,real);a.onerror=()=>{if(requestToken===audioFallbackToken)playTTSFallback(q,btn,real)};try{await a.play();return}catch(e){if(requestToken===audioFallbackToken)return playTTSFallback(q,btn,real)}}if(requestToken===audioFallbackToken)playTTSFallback(q,btn,real)}

function realSetup(sc){navActive('home');setProgress(0);sc.innerHTML=`<section class="examModeHero"><img src="${ASSETS['exam_student.png']}" alt="exam student"><div class="examCopy"><span class="eyebrow">TOPIK II · REAL EXAM</span><h1>${tr('real')}</h1><p>${ml('실제 시험처럼 해설 없이 시간을 재며 풉니다. 전체 시험과 영역별 도전을 선택할 수 있습니다.','本番同様、解説なしで時間を計って解きます。フル試験と領域別挑戦を選べます。','Timed exam practice without explanations. Choose full exam or a single section.','像真实考试一样计时作答，不显示解析，可选择全套或单项。')}</p></div></section><div class="sectionTitle"><h2>${ml('전체 실전','フル実戦','Full exam','全套实战')}</h2><span>180 MIN</span></div><button class="primary" onclick="beginReal('full')">▶ ${ml('듣기 → 쓰기 → 읽기 전체 시작','聴解→作文→読解を開始','Start Listening → Writing → Reading','开始听力→写作→阅读')}</button><div class="sectionTitle"><h2>${ml('개별 도전','領域別チャレンジ','Section challenge','单项挑战')}</h2><span>TOPIK II</span></div><div class="challengeGrid"><button class="challengeCard" onclick="beginReal('listen')"><div class="ci">🎧</div><div><b>${ml('듣기만 풀기','聴解だけ','Listening only','仅听力')}</b><small>50 QUESTIONS</small></div><div class="ct">60 MIN ›</div></button><button class="challengeCard" onclick="beginReal('read')"><div class="ci">📖</div><div><b>${ml('읽기만 풀기','読解だけ','Reading only','仅读写')}</b><small>50 QUESTIONS</small></div><div class="ct">70 MIN ›</div></button><button class="challengeCard" onclick="beginReal('write')"><div class="ci">✍️</div><div><b>${ml('쓰기만 풀기','作文だけ','Writing only','仅写作')}</b><small>4 QUESTIONS</small></div><div class="ct">50 MIN ›</div></button></div><div class="infoCard"><h3>🔒 ${ml('실전 규칙','実戦ルール','Exam rules','实战规则')}</h3><p>${ml('문제별 해설은 시험 종료 후에만 열립니다. 실전 듣기는 문항당 한 번만 재생되며, 다음 문제로 이동하면 재생 중인 음성이 즉시 멈춥니다.','問題ごとの解説は終了後のみ。実戦聴解は1問1回で、次へ進むと再生中の音声は即停止します。','Explanations unlock only after the exam. Listening plays once per question and stops immediately when you move on.','每题解析仅在考试结束后开放。实战听力每题仅播放一次，进入下一题时立即停止。')}</p></div>`}

function writingEstimate(){let total=0;for(const id of[51,52]){const text=(S.writing[id]||'').trim(),chars=text.replace(/\s/g,'').length;total+=Math.min(10,(chars>=8?6:chars>=3?3:0)+(/[.!?。]|[다요]$/.test(text)?2:0)+(/고|며|지만|때문|위해/.test(text)?2:0))}let q53=S.writing[53]||'',c53=q53.replace(/\s/g,'').length,s53=c53>=200&&c53<=300?16:c53>=150?10:c53>=80?5:0;s53+=Math.min(8,(q53.match(/\d+(?:\.\d+)?%?/g)||[]).length*2);if(/반면|증가|감소|차이|가장|비교/.test(q53))s53+=4;if((q53.match(/\n/g)||[]).length>=1)s53+=2;total+=Math.min(30,s53);let q54=S.writing[54]||'',c54=q54.replace(/\s/g,'').length,s54=c54>=600&&c54<=750?24:c54>=480?17:c54>=300?9:0;s54+=Math.min(14,(q54.match(/따라서|그러나|또한|반면|먼저|다음으로|결국|때문|예를 들면/g)||[]).length*2);if((q54.match(/\n/g)||[]).length>=2)s54+=6;if(new Set(q54.split(/\s+/).filter(Boolean)).size>=90)s54+=6;total+=Math.min(50,s54);return Math.round(Math.min(100,total))}

function playDrumRoll(){try{let ac=new (window.AudioContext||window.webkitAudioContext)();let now=ac.currentTime;for(let i=0;i<18;i++){let t=now+i*.14,buf=ac.createBuffer(1,ac.sampleRate*.045,ac.sampleRate),d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,2);let s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;g.gain.setValueAtTime(.05+i*.004,t);g.gain.exponentialRampToValueAtTime(.001,t+.045);s.connect(g).connect(ac.destination);s.start(t)}let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(880,now+2.8);o.frequency.exponentialRampToValueAtTime(1320,now+3.05);g.gain.setValueAtTime(.001,now+2.8);g.gain.exponentialRampToValueAtTime(.18,now+2.82);g.gain.exponentialRampToValueAtTime(.001,now+3.25);o.connect(g).connect(ac.destination);o.start(now+2.8);o.stop(now+3.3)}catch(e){}}

async function buildExplanation(type,q){if(q?.bankId){let answer=q.section==='writing'?(q.model||''):q.choices?.[q.answerIndex]||'',base=S.lang==='ja'?(q.explanationJa||q.explanationKo):q.explanationKo||q.explanation||'',detail=(S.lang==='ko'||S.lang==='ja')?base:await translateCached(`bank_${q.bankId}_${S.lang}`,base,'ko',S.lang);if(q.section==='writing')return `<h3>${ml('모범답안','模範解答','Model answer','参考答案')}</h3><div class="answerBox"><p>${esc(answer)}</p></div><h3>${tr('why')}</h3><p>${esc(detail)}</p>`;return `<h3>${tr('answer')}</h3><div class="answerBox"><p>${esc(answer)}</p></div><h3>${tr('why')}</h3><p>${esc(detail)}</p>${q.targetSkills?.length?`<h3>${tr('words')}</h3><p>${esc(q.targetSkills.join(' · '))}</p>`:''}`}
 if(type==='listen'){let ans=q.answer||['①','②','③','④'][q.answerIndex],jaScript=q.scriptJa||q.script,jaChoice=(q.choicesJa||q.choices)[q.answerIndex]||'';let baseJa=`正解は${ans}です。音声では次の内容がポイントになります。\n${jaScript}\n\n正解選択肢：${jaChoice}`;let txt=S.lang==='ja'?baseJa:S.lang==='ko'?`정답은 ${ans}입니다. 음성의 핵심 내용과 정답 선택지를 비교하면 답을 찾을 수 있습니다.\n\n${q.script}`:await translateCached('listen_'+q.id,baseJa,'ja',S.lang);return `<h3>${tr('answer')}</h3><div class="answerBox"><p>${esc(ans)}</p></div><h3>${tr('why')}</h3><p>${esc(txt)}</p>`}

async function translateCached(key,text,src,target){if(!text)return'';if(target===src)return text;let ck=src+'_'+target+'_'+key;if(S.transCache[ck])return S.transCache[ck];let parts=splitText(text,360),out=[];for(let p of parts){try{let code=target==='zh'?'zh-CN':target;let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(p)+'&langpair='+src+'%7C'+code;let r=await fetch(url),j=await r.json();out.push(j?.responseData?.translatedText||p)}catch(e){out.push(p)}}let res=out.join(' ');S.transCache[ck]=res;save();return res}
