name: Verify MALBIT

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Install Japanese visual-check font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify Travel Mode at 390x844
        run: node scripts/check-travel-mobile.mjs
      - name: Upload mobile visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: travel-mobile-${{ github.sha }}
          path: artifacts/travel-mobile/*.png
          if-no-files-found: error
