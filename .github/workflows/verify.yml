name: Verify MALBIT

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Full audio playback, writing keyboard/settings matrices, baseline and home QA.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - name: Install Japanese visual-check font
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Verify original content and translated transcript flows
        run: HARUMAL_ORIGINAL_CONTENT_ONLY=1 node scripts/check-travel-mobile.mjs
      - name: Upload original content evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-content-${{ github.sha }}
          path: artifacts/original-content/*.png
          if-no-files-found: error
      - name: Verify quick practice menus and area sessions
        run: HARUMAL_QUICK_PRACTICE_ONLY=1 node scripts/check-travel-mobile.mjs
      - name: Upload quick practice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-practice-${{ github.sha }}
          path: artifacts/quick-practice/*.png
          if-no-files-found: warn
      - name: Verify saved vocabulary flashcards
        run: HARUMAL_FLASHCARDS_ONLY=1 node scripts/check-travel-mobile.mjs
      - name: Verify question identity, reports, transcripts and centered results
        run: node scripts/check-question-experience.mjs
      - name: Upload question experience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-experience-${{ github.sha }}
          path: artifacts/question-experience/
          if-no-files-found: warn
      - name: Upload flashcard mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-${{ github.sha }}
          path: |
            artifacts/flashcards/*.png
            artifacts/flashcards/*.mp4
          if-no-files-found: warn
      - name: Verify Travel Mode at 390x844
        run: node scripts/check-travel-mobile.mjs
      - name: Capture production intro baseline
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --depth=1 origin main
          git worktree add --detach ../intro-baseline FETCH_HEAD
          HARUMAN_INTRO_BASELINE=1 MALBIT_TEST_ROOT="$GITHUB_WORKSPACE/../intro-baseline" node scripts/check-travel-mobile.mjs
      - name: Verify Home and Vocabulary in four languages
        run: HARUMAL_FOCUS_ONLY=1 node scripts/check-travel-mobile.mjs
      - name: Verify reusable Korean street tiles
        run: node scripts/check-korean-street-tiles.mjs
      - name: Upload mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-mobile-${{ github.sha }}
          path: |
            artifacts/travel-mobile/*.png
            artifacts/home-vocabulary/*.png
            artifacts/intro-baseline/*.png
          if-no-files-found: error
      - name: Upload focused intro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-completion-${{ github.sha }}
          path: |
            artifacts/travel-mobile/intro-*.png
            artifacts/intro-baseline/*.png
          if-no-files-found: error
      - name: Upload growth learning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-learning-${{ github.sha }}
          path: artifacts/travel-mobile/growth-*.png
          if-no-files-found: warn
      - name: Upload focused writing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-curriculum-${{ github.sha }}
          path: artifacts/travel-mobile/writing-*.png
          if-no-files-found: warn
