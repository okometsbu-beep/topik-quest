<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MALBIT reusable Seoul street block fixture</title>
  <link rel="icon" href="../../icon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    :root{color-scheme:light;--canvas:#edf2f6;--surface:#fff;--text:#17283b;--line:#cbd7e1;--muted:#64778a;--accent:#0b7f76;--route:#0b7f76;--collision:#bd3b4b;--shadow:rgba(12,29,45,.2)}
    :root[data-theme="dark"]{color-scheme:dark;--canvas:#081525;--surface:#14283f;--text:#edf6ff;--line:#36516d;--muted:#a9bfd2;--accent:#69dfcf;--route:#69dfcf;--collision:#ff8b96;--shadow:rgba(0,0,0,.38)}
    body{margin:0;background:var(--canvas);color:var(--text);font-family:system-ui,sans-serif}
    main{display:grid;gap:14px;width:min(100%,620px);margin:auto;padding:16px 16px 28px}
    header{display:grid;gap:4px}h1{margin:0;font-size:18px;line-height:1.15}p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .blockFixtureFrame{position:relative;width:100%;aspect-ratio:6/5;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#d7d9d5;box-shadow:0 10px 24px var(--shadow);isolation:isolate}
    .blockFixtureGround,.blockFixtureUpper,.blockFixtureDebug{position:absolute;inset:0}
    .blockFixtureGround{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));z-index:1}
    .blockFixtureTile,.blockFixtureUpperTile{display:block;background-repeat:no-repeat;background-size:400% 400%;image-rendering:pixelated;opacity:1;filter:none}
    .blockFixtureUpper{z-index:3;pointer-events:none}
    .blockFixtureUpperTile{position:absolute;width:calc(100% / 12);height:10%;z-index:var(--depth)}
    .blockFixtureUpperTile::after{content:"";position:absolute;left:10%;right:10%;top:var(--baseline);border-top:1px solid color-mix(in srgb,var(--accent) 76%,transparent)}
    .blockFixtureDebug{z-index:4;pointer-events:none}
    .blockFixtureCollision{position:absolute;width:calc(100% / 12);height:10%;border:2px dashed var(--collision);background:color-mix(in srgb,var(--collision) 10%,transparent)}
    .blockFixturePort{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--route);box-shadow:0 0 0 2px color-mix(in srgb,var(--surface) 86%,transparent)}
    .blockFixtureSummary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .blockFixtureSummary article{display:grid;gap:3px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
    .blockFixtureSummary small{color:var(--muted);font-size:9px;line-height:1.2;text-transform:uppercase;letter-spacing:.04em}.blockFixtureSummary b{font-size:13px}
    .blockFixtureLegend{display:flex;flex-wrap:wrap;gap:6px}.blockFixtureLegend span{padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:9px}
  </style>
  <script src="../../data/travel-tiles-korean-street-v1.js"></script>
  <script src="../../data/travel-tiles-korean-street-corners-v1.js"></script>
  <script src="../../data/travel-tiles-korean-street-junctions-v1.js"></script>
  <script src="../../data/travel-tiles-korean-street-building-entrances-v1.js"></script>
  <script src="../../data/travel-tiles-korean-street-decor-upper-v1.js"></script>
  <script src="../../data/travel-block-korean-street-v1.js"></script>
</head>
<body>
  <main>
    <header><h1>Reusable Seoul street block</h1><p>Five catalogs composed by ID · connected walk routes · upper baselines · resolved collision footprints.</p></header>
    <section class="blockFixtureFrame" aria-label="Non-playable reusable Seoul street block">
      <div class="blockFixtureGround"></div>
      <div class="blockFixtureUpper"></div>
      <div class="blockFixtureDebug"></div>
    </section>
    <section class="blockFixtureSummary" aria-label="Street block composition summary">
      <article><small>Catalogs</small><b data-stat="catalogs">0</b></article>
      <article><small>Walk routes</small><b data-stat="routes">0</b></article>
      <article><small>Blocked cells</small><b data-stat="collisions">0</b></article>
    </section>
    <section class="blockFixtureLegend" aria-label="Street block catalog list"></section>
  </main>
  <script>
    (function(){
      'use strict';
      const params=new URLSearchParams(location.search),theme=params.get('theme')==='dark'?'dark':'light';
      document.documentElement.dataset.theme=theme;
      const block=window.MALBIT_TRAVEL_BLOCK_SCHEMAS?.find(item=>item.id==='korean-street-block-fixture-v1'),validator=window.MALBIT_TRAVEL_BLOCK_VALIDATOR;
      if(!block||!validator)throw new Error('Seoul street block fixture data missing');
      const errors=validator.validateBlock(block);if(errors.length)throw new Error(errors.join('; '));
      const artStyle=match=>{
        const {entry,atlas}=match,positionX=entry.atlasX/(atlas.columns-1)*100,positionY=entry.atlasY/(atlas.rows-1)*100;
        return`background-image:url('../../${atlas.image}');background-position:${positionX}% ${positionY}%`;
      };
      const ground=document.querySelector('.blockFixtureGround'),upper=document.querySelector('.blockFixtureUpper'),debug=document.querySelector('.blockFixtureDebug');
      block.layers.ground.flat().forEach((reference,index)=>{
        const match=validator.resolve(reference,'ground'),tile=document.createElement('i');
        tile.className='blockFixtureTile';tile.dataset.catalogId=reference.catalogId;tile.dataset.tileId=reference.tileId;tile.dataset.walkable=String(match.entry.walkable);tile.style.cssText=artStyle(match);ground.appendChild(tile);
      });
      block.layers.upper.forEach(placement=>{
        const match=validator.resolve(placement.ref,'upper'),tile=document.createElement('i');
        tile.className='blockFixtureUpperTile';tile.dataset.catalogId=placement.ref.catalogId;tile.dataset.tileId=placement.ref.tileId;tile.dataset.baseline=String(match.entry.baselineY);tile.dataset.blocks=String(Boolean(match.entry.collisionFootprint?.cells?.length));
        tile.style.cssText=`${artStyle(match)};left:${placement.x/block.width*100}%;top:${placement.y/block.height*100}%;--baseline:${match.entry.baselineY/match.atlas.sourceTileSize*100}%;--depth:${10+placement.y}`;upper.appendChild(tile);
      });
      block.expectedCollisionCells.forEach(key=>{
        const [x,y]=key.split(',').map(Number),cell=document.createElement('i');cell.className='blockFixtureCollision';cell.dataset.cell=key;cell.style.left=`${x/block.width*100}%`;cell.style.top=`${y/block.height*100}%`;debug.appendChild(cell);
      });
      block.ports.forEach(port=>{
        const marker=document.createElement('i');marker.className='blockFixturePort';marker.dataset.portId=port.id;marker.dataset.material=port.material;
        marker.style.left=`${(port.x+.5)/block.width*100}%`;marker.style.top=`${(port.y+.5)/block.height*100}%`;debug.appendChild(marker);
      });
      document.querySelector('[data-stat="catalogs"]').textContent=String(block.requiredCatalogs.length);
      document.querySelector('[data-stat="routes"]').textContent=String(block.routes.length);
      document.querySelector('[data-stat="collisions"]').textContent=String(block.expectedCollisionCells.length);
      const legend=document.querySelector('.blockFixtureLegend');block.requiredCatalogs.forEach(id=>{const chip=document.createElement('span');chip.textContent=id.replace('korean-street-','').replace('-v1','');legend.appendChild(chip)});
      window.__MALBIT_STREET_BLOCK_READY__=true;
    })();
  </script>
</body>
</html>
