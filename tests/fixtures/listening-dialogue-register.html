<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><link rel="stylesheet" href="listening-player.css"><title>Dialogue register QA</title><style>body{margin:0;padding:12px;background:var(--ui-canvas);color:var(--ui-ink);font:14px system-ui;box-sizing:border-box}html{--ui-canvas:#f5f8f4;--ui-surface:#fff;--ui-ink:#173d34;--ui-border:#bdd3c9}html[data-theme=dark]{--ui-canvas:#0e2420;--ui-surface:#16372f;--ui-ink:#ebf5ee;--ui-border:#426b5c}button,select{min-height:44px;max-width:100%;font:inherit}nav{display:flex;gap:6px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:18px}</style></head><body><h1>대화 높임말 음원 QA</h1><p>수정한 두 대화 MP3 · 보상 기록 없음</p><nav><select aria-label="QA language" onchange="S.lang=this.value;draw()"><option>ko</option><option>ja</option><option>en</option><option>zh</option></select><select aria-label="QA theme" onchange="document.documentElement.dataset.theme=this.value"><option>light</option><option>dark</option></select><button onclick="choose('dialogue')">택배 대화 6번</button><button onclick="choose('food')">반찬 대화 17번</button><button onclick="choose('missing')">누락 파일</button><button onclick="choose('exam')">실전 1회</button><button onclick="MALBIT_TTS.play('회의 시간을 확인해 주세요.')">일반 단어 읽기</button><button onclick="HARUMAL_LISTENING_PLAYER.cancel();document.querySelector('#player').innerHTML='다른 문제로 이동';document.querySelector('#result').textContent='navigation cancelled'">다음 문제로 이동</button></nav><pre id="script"></pre><div id="player"></div><pre id="result" aria-live="polite"></pre><script>var S={lang:'ko'};</script><script src="listening-audio.js"></script><script src="tts-quality.js"></script><script src="listening-player.js"></script><script src="data/listening-dialogue-register-v1.js"></script><script src="listening-dialogue-register.js"></script><script>
const scripts=Object.keys(HARUMAL_LISTENING_DIALOGUE_REGISTER.scripts),dialogue=scripts[0],food=scripts[1];let mode='dialogue',consumed=false;
function draw(){HARUMAL_LISTENING_PLAYER.cancel();document.querySelector('#player').innerHTML=HARUMAL_LISTENING_PLAYER.markup('start(false)','qa',{once:mode==='exam',played:consumed});}
function choose(value){mode=value;document.querySelector('#script').textContent=mode==='food'?food:dialogue;consumed=false;document.querySelector('#result').textContent='';draw();}
function start(forceDevice){if(HARUMAL_LISTENING_PLAYER.busy('qa')){HARUMAL_LISTENING_PLAYER.cancel();return;}if(consumed)return;HARUMAL_LISTENING_PLAYER.play({key:'qa',script:mode==='missing'?'여자: 파일을 불러오지 못했어요.':mode==='food'?food:dialogue,forceDevice,once:mode==='exam',legacy:()=>Promise.resolve('audio/listening/v1/qa-missing-file.mp3'),onDevice:()=>start(true),onStart(){if(mode==='exam'){consumed=true;document.querySelector('[data-listening-player]').dataset.playerPlayed='1'}},onResult(result){if(result.error){consumed=false;document.querySelector('[data-listening-player]').dataset.playerPlayed='0';}document.querySelector('#result').textContent=JSON.stringify(result,null,2)}});}
choose('dialogue');
</script></body></html>
