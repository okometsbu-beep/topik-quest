참가비: 없음
※ 음식은 판매할 수 없습니다.</title><desc id="desc">원문과 동일한 안내문. 줄바꿈과 테두리만 새로 구성했습니다.</desc><rect width="320" height="403" fill="#fffdf7"/><rect x="8" y="8" width="304" height="387" rx="12" fill="#fffdf7" stroke="#aebfb5" stroke-width="2"/><rect x="12" y="12" width="296" height="62" rx="10" fill="#e3eee8" stroke="#273c49" stroke-width="0"/><text x="26" y="52" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" text-anchor="start">[동네 나눔 장터]</text><text x="26" y="99" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">사용하지 않는 물건을 직접 가져와</text><text x="26" y="129" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">팔거나 다른 물건과 바꿀 수</text><text x="26" y="159" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">있습니다.</text><text x="26" y="200" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">일시: 9월 6일 토요일</text><text x="26" y="230" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">13:00~17:00</text><text x="26" y="271" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">장소: 햇빛공원</text><text x="26" y="312" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">참가비: 없음</text><text x="26" y="353" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">※ 음식은 판매할 수 없습니다.</text></svg>
