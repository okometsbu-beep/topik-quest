<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650"><rect width="760" height="650" fill="white"/><rect x="25" y="24" width="710" height="602" rx="22" fill="#f6f2fc" stroke="#493c70" stroke-width="3"/><path d="M 55 133 H 704" stroke="#493c70" stroke-width="3"/><text x="57" y="99" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="42" fill="#493c70" font-weight="700">작은 마당 영화 밤</text><text x="57" y="185" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" fill="#493c70" font-weight="400">대사와 음악 없이 보는 옛날 영화</text><text x="57" y="257" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" fill="#493c70" font-weight="400">이야기는 화면의 한국어 자막으로 읽어요.</text><text x="57" y="323" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" fill="#493c70" font-weight="400">8월 12일 저녁 8시 / 마을 도서관 마당</text><text x="57" y="389" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" fill="#493c70" font-weight="400">참가비 없음 · 이어폰 필요 없음</text><text x="57" y="455" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" fill="#493c70" font-weight="400">먼저 오신 분부터 빈자리에 앉으세요.</text><text x="57" y="539" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="27" fill="#493c70" font-weight="400">비가 오면 도서관 강당에서 상영합니다.</text></svg>