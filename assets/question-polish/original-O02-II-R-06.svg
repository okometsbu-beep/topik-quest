<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780"><rect width="720" height="780" rx="22" fill="#edf5f5"/><rect x="22" y="22" width="676" height="736" rx="14" fill="white" stroke="#265b60" stroke-width="2"/><rect x="42" y="42" width="10" height="100" rx="5" fill="#265b60"/><text x="70" y="93" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="40" font-weight="700" fill="#265b60">사진 속 웃음,</text><text x="70" y="149" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="40" font-weight="700" fill="#265b60">게시하기 전 한 번 더</text><text x="70" y="205" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">함께 찍은 사진이라도</text><text x="70" y="263" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">공개를 원하지 않을 수 있어요.</text><text x="70" y="321" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">올리기 전에 사진 속 사람에게</text><text x="70" y="379" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">물어보세요.</text><text x="70" y="437" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">작은 확인이 서로의 마음을 지킵니다.</text><text x="70" y="495" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">다정한 온라인 생활 캠페인</text><g transform="translate(505 618)" stroke="#265b60" stroke-width="4" fill="none"><rect x="0" y="0" width="95" height="72" rx="10"/><circle cx="28" cy="25" r="10"/><path d="M13 59 Q28 38 43 59 M50 59 Q65 28 82 59"/></g></svg>