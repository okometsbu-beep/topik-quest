<svg xmlns="http://www.w3.org/2000/svg" width="320" height="146" viewBox="0 0 320 146" role="img" aria-labelledby="title desc"><defs><linearGradient id="hqShade1" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#a3cac2"/><stop offset="0.55" stop-color="#83b7ad"/><stop offset="1" stop-color="#6e9a91"/></linearGradient></defs><title id="title">회의실은 사용 후 불을 끄고 문을 잠가 주세요.</title><desc id="desc">원문과 동일한 안내문. 줄바꿈과 테두리만 새로 구성했습니다.</desc><rect width="320" height="146" fill="#fffdf7"/><rect x="8" y="8" width="304" height="130" rx="12" fill="#fffdf7" stroke="#273c49" stroke-width="2"/><rect x="22" y="24" width="5" height="98" rx="2" fill="url(#hqShade1)" stroke="#273c49" stroke-width="0"/><text x="40" y="54" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">회의실은 사용 후 불을 끄고</text><text x="40" y="85" fill="#273c49" stroke="none" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">문을 잠가 주세요.</text></svg>
