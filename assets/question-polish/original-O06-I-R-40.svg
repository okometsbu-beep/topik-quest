<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420"><rect width="520" height="420" fill="white"/><rect x="10" y="10" width="500" height="400" rx="16" fill="#f1f6fa" stroke="#254a65" stroke-width="2"/><rect x="10" y="10" width="500" height="83" rx="16" fill="#254a65" stroke="#254a65" stroke-width="2"/><rect x="10" y="63" width="500" height="30" rx="0" fill="#254a65" stroke="#254a65" stroke-width="0"/><text x="34" y="51" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="700" fill="#fff">작은 글씨가 잘 안 보이세요?</text><text x="34" y="130" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">독서실 돋보기를 이용하세요.</text><text x="34" y="173" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">위치: 입구 안내 책상</text><text x="34" y="216" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">이용료: 무료</text><text x="34" y="259" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">독서실 안에서만 사용하세요.</text><text x="34" y="302" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">사용한 뒤 같은 자리에 놓아 주세요.</text><text x="34" y="345" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#254a65">예약하지 않고 이용할 수 있습니다.</text></svg>