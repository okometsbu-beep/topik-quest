<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><defs><linearGradient id="hqShade1" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#f2f9fb"/><stop offset="0.55" stop-color="#eef7fa"/><stop offset="1" stop-color="#c8cfd2"/></linearGradient></defs><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="url(#hqShade1)" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="39" font-weight="700" fill="#305d72">식탁용 천 접기 체험</text><path d="M 52 132 H 728" fill="none" stroke="#305d72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#305d72">체험용 천은 현장에서 빌려 드립니다.</text><text x="52" y="260" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#305d72">천으로 꽃 모양을 접어 봅니다.</text><text x="52" y="325" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#305d72">완성한 모양을 사진으로 남길 수 있습니다.</text><text x="52" y="390" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#305d72">체험이 끝나면 천은 돌려주세요.</text><text x="52" y="455" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#305d72">천을 잘라서 사용하는 것은 안 됩니다.</text></svg>