<svg xmlns="http://www.w3.org/2000/svg" width="720" height="922" viewBox="0 0 720 922"><defs><linearGradient id="hqShade1" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#7e88a6"/><stop offset="0.55" stop-color="#515e87"/><stop offset="1" stop-color="#444f71"/></linearGradient><linearGradient id="hqShade2" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#e8ce8b"/><stop offset="0.55" stop-color="#e0bd62"/><stop offset="1" stop-color="#bc9f52"/></linearGradient><linearGradient id="hqShade4" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#f7f5ec"/><stop offset="0.55" stop-color="#f4f2e6"/><stop offset="1" stop-color="#cdcbc1"/></linearGradient></defs><rect width="720" height="922" fill="#eeeff7"/><rect x="24" y="24" width="672" height="874" rx="14" fill="#fffefb"/><rect x="24" y="24" width="16" height="874" rx="6" fill="url(#hqShade1)"/><text x="370" y="83" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="42" font-weight="700" fill="#515e87">나만의 별자리 이야기</text><g transform="translate(180,116)"><rect x="42" y="13" width="296" height="220" rx="10" fill="url(#hqShade4)" stroke="#5d6f8d" stroke-width="5"/><path d="M88 173L139 89L209 125L266 65L298 176L209 125" fill="none" stroke="#a78651" stroke-width="5"/><g fill="#e0bd62" stroke="#79694c" stroke-width="3"><circle cx="88" cy="173" r="9"/><circle cx="139" cy="89" r="9"/><circle cx="209" cy="125" r="9"/><circle cx="266" cy="65" r="9"/><circle cx="298" cy="176" r="9"/></g><path d="M83 205H247" stroke="#a6b1c0" stroke-width="4"/></g><text x="370" y="396" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">모루 창작실 / 토요일 오후 2시</text><text x="370" y="450" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">종이에 찍힌 별 점을 마음대로 이어요.</text><text x="370" y="504" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">완성한 모양에 이름과 이야기를 붙여요.</text><text x="370" y="558" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">실제 별자리 이름을 몰라도 참여할 수</text><text x="370" y="612" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">있어요.</text><text x="370" y="666" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">그림 종이와 색연필은 준비해 드립니다.</text><text x="370" y="720" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">만든 그림은 집에 가져가세요.</text><text x="370" y="774" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">실내에서 진행하며 망원경 관측은 하지</text><text x="370" y="828" text-anchor="middle" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="36" fill="#273e49">않습니다.</text></svg>