<svg xmlns="http://www.w3.org/2000/svg" width="520" height="425" viewBox="0 0 520 425"><rect width="520" height="425" fill="white"/><rect x="10" y="10" width="500" height="405" rx="15" fill="#f3f8ee" stroke="#345b42" stroke-width="2"/><rect x="10" y="10" width="500" height="84" rx="15" fill="#345b42" stroke="#345b42" stroke-width="2"/><rect x="10" y="69" width="500" height="30" rx="0" fill="#345b42" stroke="#345b42" stroke-width="0"/><text x="34" y="53" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="34" font-weight="700" fill="white">여행 중 화분을 맡기세요</text><text x="34" y="135" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">맡길 수 있는 기간: 3일~10일</text><text x="34" y="179" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">요금: 화분 한 개에 하루 1,000원</text><text x="34" y="223" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">가게에서 물을 주고 돌봐 드립니다.</text><text x="34" y="267" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">맡길 때는 직접 가져오시고,</text><text x="34" y="311" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">찾을 때도 가게로 와 주세요.</text><text x="34" y="355" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#345b42">집으로 가거나 배달하지 않습니다.</text></svg>