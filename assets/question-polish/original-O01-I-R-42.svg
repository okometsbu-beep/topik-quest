<svg xmlns="http://www.w3.org/2000/svg" width="760" height="587" viewBox="0 0 760 587"><rect width="760" height="587" fill="#ffffff"/><rect x="18" y="18" width="724" height="551" rx="18" fill="#eff6ed" stroke="#315c43" stroke-width="3"/><rect x="18" y="18" width="724" height="118" rx="18" fill="#315c43" stroke="#315c43" stroke-width="3"/><rect x="18" y="95" width="724" height="41" rx="0" fill="#315c43" stroke="#315c43" stroke-width="0"/><text x="52" y="94" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="42" font-weight="700" fill="#fff">겨울옷 모으기</text><text x="52" y="190" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">작아져서 입지 못하는 깨끗한</text><text x="52" y="241" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">겨울옷을 보내 주세요.</text><text x="52" y="292" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">모으는 기간: 11월 1일~11월 15일</text><text x="52" y="343" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="700" fill="#315c43">받는 곳: 나눔센터 1층 안내실</text><text x="52" y="394" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">접수 방법: 직접 방문 또는 택배</text><text x="52" y="445" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">보내 주신 옷은 도움이 필요한</text><text x="52" y="496" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#315c43">이웃에게 전합니다.</text><line x1="52" y1="522" x2="708" y2="522" stroke="#315c43" stroke-width="1" stroke-linecap="round"/></svg>