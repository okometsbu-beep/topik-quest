<svg xmlns="http://www.w3.org/2000/svg" width="320" height="332" viewBox="0 0 320 332" role="img" aria-labelledby="title desc"><title id="title">공유 작업실 이용 안내
평일: 오전 9시~오후 9시
토요일: 오전 10시~오후 5시
일요일·공휴일: 휴무
회의실은 이용 하루 전까지 예약해야 하며 음식물은 반입할 수 없습니다.</title><desc id="desc">원문과 동일한 안내문. 줄바꿈과 테두리만 새로 구성했습니다.</desc><rect width="320" height="332" fill="#fffdf7"/><rect x="8" y="8" width="304" height="316" rx="12" fill="#fffdf7" stroke="#aebfb5" stroke-width="2"/><rect x="12" y="12" width="296" height="62" rx="10" fill="#e3eee8" stroke="#273c49" stroke-width="0"/><text x="26" y="52" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="start">공유 작업실 이용 안내</text><text x="26" y="99" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">평일: 오전 9시~오후 9시</text><text x="26" y="140" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">토요일: 오전 10시~오후 5시</text><text x="26" y="181" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">일요일·공휴일: 휴무</text><text x="26" y="222" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">회의실은 이용 하루 전까지</text><text x="26" y="252" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">예약해야 하며 음식물은 반입할 수</text><text x="26" y="282" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">없습니다.</text></svg>
