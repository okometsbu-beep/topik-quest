<svg xmlns="http://www.w3.org/2000/svg" width="320" height="209" viewBox="0 0 320 209" role="img" aria-labelledby="title desc"><title id="title">엘리베이터 점검 안내
오늘 오후 2시부터 4시까지 엘리베이터를 사용할 수 없습니다. 이 시간에는 계단을 이용해 주세요.</title><desc id="desc">원문과 동일한 안내문. 줄바꿈과 테두리만 새로 구성했습니다.</desc><rect width="320" height="209" fill="#fffdf7"/><rect x="8" y="8" width="304" height="193" rx="12" fill="#fffdf7" stroke="#aebfb5" stroke-width="2"/><rect x="12" y="12" width="296" height="62" rx="10" fill="#e3eee8" stroke="#273c49" stroke-width="0"/><text x="26" y="52" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="start">엘리베이터 점검 안내</text><text x="26" y="99" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">오늘 오후 2시부터 4시까지</text><text x="26" y="129" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">엘리베이터를 사용할 수 없습니다.</text><text x="26" y="159" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">이 시간에는 계단을 이용해 주세요.</text></svg>
