<svg xmlns="http://www.w3.org/2000/svg" width="320" height="239" viewBox="0 0 320 239" role="img" aria-labelledby="title desc"><title id="title">분실물 보관소
버스에서 물건을 잃어버린 분은 버스 번호와 탄 시간을 확인한 후 02-123-4567로 전화해 주세요. 보관 기간은 7일입니다.</title><desc id="desc">원문과 동일한 안내문. 줄바꿈과 테두리만 새로 구성했습니다.</desc><rect width="320" height="239" fill="#fffdf7"/><rect x="8" y="8" width="304" height="223" rx="12" fill="#fffdf7" stroke="#aebfb5" stroke-width="2"/><rect x="12" y="12" width="296" height="62" rx="10" fill="#e3eee8" stroke="#273c49" stroke-width="0"/><text x="26" y="52" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="22" font-weight="700" text-anchor="start">분실물 보관소</text><text x="26" y="99" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">버스에서 물건을 잃어버린 분은</text><text x="26" y="129" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">버스 번호와 탄 시간을 확인한 후</text><text x="26" y="159" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">02-123-4567로 전화해 주세요.</text><text x="26" y="189" fill="#273c49" stroke="none" font-family="Noto Sans CJK KR, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="start">보관 기간은 7일입니다.</text></svg>
