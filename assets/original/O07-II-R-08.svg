<svg xmlns="http://www.w3.org/2000/svg" width="560" height="787" viewBox="0 0 560 787"><rect width="560" height="787" rx="18" fill="#fbf4ed"/><rect x="15" y="15" width="530" height="757" rx="12" fill="#fff" stroke="#654d3d" stroke-width="3"/><rect x="31" y="34" width="9" height="48" rx="4" fill="#654d3d"/><text x="280" y="69" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="34" font-weight="700" fill="#654d3d">내 글씨를 여러 번 찍어 보세요</text><g transform="translate(151,98)"><path d="M118 24Q140 8 162 24L166 89H115Z" fill="#b08b70" stroke="#654d3d" stroke-width="5"/><rect x="91" y="88" width="99" height="29" rx="6" fill="#ddbe9c" stroke="#654d3d" stroke-width="5"/><rect x="99" y="118" width="83" height="12" fill="#654d3d"/><path d="M32 154H227V239H32Z" fill="#fff" stroke="#796654" stroke-width="4"/><path d="M63 188Q70 171 81 185T106 185M119 175V207M116 193H142M156 179Q180 172 193 193M160 207H199" fill="none" stroke="#936f94" stroke-width="6" stroke-linecap="round"/></g><text x="280" y="383" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">흰 종이에 쓴 글씨를 사진으로 보내</text><text x="280" y="431" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">주세요.</text><text x="280" y="479" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">손으로 쓴 모양을 살려 고무도장에</text><text x="280" y="527" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">새깁니다.</text><text x="280" y="575" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">받는 이의 이름부터 짧은 인사말까지!</text><text x="280" y="623" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">제작 전 실제 크기의 시안을 보내</text><text x="280" y="671" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">드립니다.</text><text x="280" y="719" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#654d3d">한결 손글씨 도장</text></svg>