<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#fbf4e9" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR, sans-serif" font-size="39" font-weight="700" fill="#775e38">동물 얼굴 가면 꾸미기</text><path d="M 52 132 H 728" fill="none" stroke="#775e38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#775e38">한 사람에게 바탕 가면 한 개를 드립니다.</text><text x="52" y="260" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#775e38">물감으로 원하는 무늬를 그리세요.</text><text x="52" y="325" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#775e38">이름은 가면 안쪽에 적어 주세요.</text><text x="52" y="390" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#775e38">끈은 직원이 매어 드립니다.</text><text x="52" y="455" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#775e38">물감이 마른 뒤에 가면을 쓰세요.</text></svg>