<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#eef7fa" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR,sans-serif" font-size="39" fill="#305d72" font-weight="700">접이식 탁자 빌려 드려요</text><path d="M 52 132 H 728" fill="none" stroke="#305d72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">하루 대여료: 한 개 3,000원</text><text x="52" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">한 사람당 두 개까지 빌릴 수 있습니다.</text><text x="52" y="325" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">탁자 하나에 두 사람이 앉을 수 있습니다.</text><text x="52" y="390" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">직접 가져가고 직접 반납해 주세요.</text><text x="52" y="455" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">탁자 위에 까는 천은 따로 빌려야 합니다.</text></svg>