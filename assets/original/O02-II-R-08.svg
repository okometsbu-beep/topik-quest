<svg xmlns="http://www.w3.org/2000/svg" width="720" height="770" viewBox="0 0 720 770"><rect width="720" height="770" rx="22" fill="#f2eff8"/><rect x="22" y="22" width="676" height="726" rx="14" fill="white" stroke="#5a477e" stroke-width="2"/><rect x="42" y="42" width="10" height="100" rx="5" fill="#5a477e"/><text x="70" y="93" font-family="Noto Sans CJK KR, sans-serif" font-size="40" font-weight="700" fill="#5a477e">우리 집 선율을 다시 고르게</text><text x="70" y="211" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">건반마다 달라진 음의 높이,</text><text x="70" y="269" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">전문가가 직접 방문해</text><text x="70" y="327" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">서로 어울리도록 맞춥니다.</text><text x="70" y="385" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">오래 쉬었던 피아노도</text><text x="70" y="443" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">상담해 주세요.</text><text x="70" y="501" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">소리결 · 방문 날짜 전화 예약</text><g transform="translate(445 620)" stroke="#5a477e" stroke-width="3"><rect x="0" y="0" width="180" height="75" fill="white"/><path d="M30 0 V75 M60 0 V75 M90 0 V75 M120 0 V75 M150 0 V75"/><path d="M22 0 H38 V42 H22 Z M52 0 H68 V42 H52 Z M112 0 H128 V42 H112 Z M142 0 H158 V42 H142 Z" fill="#5a477e"/></g></svg>