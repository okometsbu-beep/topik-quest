<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img"><rect width="720" height="840" fill="#fff"/><rect x="25" y="25" width="670" height="790" rx="22" fill="#fbf4ec" stroke="#aa704a" stroke-width="3"/><text x="65" y="103" font-family="Noto Sans CJK KR, sans-serif" font-size="42" fill="#203340" font-weight="700" text-anchor="start">퍼즐 교환함</text><text x="65" y="162" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="400" text-anchor="start">다 맞춘 퍼즐을</text><text x="65" y="204" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="400" text-anchor="start">다른 퍼즐과 바꿔 보세요.</text><rect x="55" y="245" width="610" height="245" rx="12" fill="#fff" stroke="#c39b7d" stroke-width="2"/><text x="77" y="292" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="500" text-anchor="start">조각이 모두 있는 퍼즐만</text><text x="77" y="334" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="500" text-anchor="start">넣어 주세요.</text><text x="77" y="398" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="500" text-anchor="start">한 상자를 넣으면</text><text x="77" y="440" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="500" text-anchor="start">한 상자를 가져갈 수 있습니다.</text><text x="65" y="545" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="400" text-anchor="start">퍼즐 조각은 봉투에 담아</text><text x="65" y="587" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203340" font-weight="400" text-anchor="start">상자에 넣어 주세요.</text><path d="M 60 629 H 660" stroke="#c5a688" stroke-width="2"/><text x="65" y="685" font-family="Noto Sans CJK KR, sans-serif" font-size="28" fill="#203340" font-weight="400" text-anchor="start">이용 장소: 도서관 1층 놀이방</text><text x="65" y="741" font-family="Noto Sans CJK KR, sans-serif" font-size="29" fill="#203