<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652"><rect width="720" height="652" fill="#eef0e9"/><rect x="24" y="24" width="672" height="604" rx="14" fill="#fffefb"/><rect x="24" y="24" width="16" height="604" rx="6" fill="#496550"/><text x="370" y="83" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="42" font-weight="700" fill="#496550">글씨를 지울 때 떨어지는</text><g transform="translate(180,116)"><rect x="36" y="20" width="310" height="164" rx="8" fill="#45665d" stroke="#304c45" stroke-width="6"/><path d="M82 70H238M82 101H290M82 132H202" stroke="#f6f4e8" stroke-width="7" stroke-linecap="round"/><path d="M24 185H358L337 223H45Z" fill="#c9d6d9" stroke="#45626b" stroke-width="5"/><path d="M62 195L80 203M113 197L127 204M172 199L189 202M235 193L245 201M297 200L317 196" stroke="#fff" stroke-width="5"/></g><text x="370" y="396" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">하얀 가루, 바닥까지 날리지 않게!</text><text x="370" y="450" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">칠판 아래에 길게 끼우세요.</text><text x="370" y="504" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">얕은 홈에 모인 가루만</text><text x="370" y="558" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">마지막에 비우면 됩니다.</text></svg>