<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060"><rect width="720" height="1060" fill="#f1f3f8"/><rect x="25" y="25" width="670" height="1010" fill="white" rx="16"/><text x="50" y="98" font-family="Noto Sans CJK KR,sans-serif" font-size="40" fill="#344b70" font-weight="700">지하 보행통로 공사 안내</text><rect x="48" y="144" width="624" height="156" fill="#e5eaf4" rx="10"/><text x="70" y="202" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#344b70" font-weight="700">기간: 10월 14일~16일</text><text x="70" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#344b70" font-weight="700">시간: 매일 09:00~17:00</text><text x="50" y="379" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">공사 시간에는 동쪽 입구를</text><text x="50" y="435" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">이용할 수 없습니다.</text><text x="50" y="523" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">서쪽 입구와 중앙 계단은</text><text x="50" y="579" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">이용할 수 있습니다.</text><text x="50" y="667" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">통로 안 상점은</text><text x="50" y="723" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">평소대로 영업합니다.</text><text x="50" y="829" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">17:00 이후에는</text><text x="50" y="885" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#2b3c55" font-weight="400">두 입구 모두 개방합니다.</text><path d="M50 950H670" stroke="#bdc9db" stroke-width="3"/></svg>