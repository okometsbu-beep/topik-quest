<svg xmlns="http://www.w3.org/2000/svg" width="560" height="691" viewBox="0 0 560 691"><rect width="560" height="691" rx="18" fill="#eef8f7"/><rect x="15" y="15" width="530" height="661" rx="12" fill="#fff" stroke="#245d65" stroke-width="3"/><rect x="31" y="34" width="9" height="48" rx="4" fill="#245d65"/><text x="280" y="69" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="34" font-weight="700" fill="#245d65">넓게 받아 좁게 모아</text><g transform="translate(151,98)"><path d="M85 100H177L145 148V188H120V148Z" fill="#a6d5d1" stroke="#245d65" stroke-width="5"/><ellipse cx="131" cy="100" rx="46" ry="12" fill="#e6f5ef" stroke="#245d65" stroke-width="5"/><path d="M118 177H148V198H164V242H101V198H118Z" fill="#fff" stroke="#245d65" stroke-width="5"/><path d="M36 36L92 19L108 65L52 82Z" fill="#f0cd86" stroke="#715730" stroke-width="4"/><path d="M102 58Q121 71 130 94" fill="none" stroke="#c8a162" stroke-width="7" stroke-dasharray="3 8"/><path d="M112 224H154" stroke="#e4c999" stroke-width="19"/></g><text x="280" y="383" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">가루를 작은 병에 옮길 때</text><text x="280" y="431" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">입구 밖으로 흘리지 마세요.</text><text x="280" y="479" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">넓은 윗부분은 펴고</text><text x="280" y="527" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">좁은 아랫부분은 병목에 끼우세요.</text><text x="280" y="575" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">사용 후에는 납작하게 접어 보관!</text><text x="280" y="623" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#245d65">모아담 접이식 깔때기</text></svg>