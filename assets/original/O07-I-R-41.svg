<svg xmlns="http://www.w3.org/2000/svg" width="520" height="425" viewBox="0 0 520 425"><rect width="520" height="425" fill="white"/><rect x="10" y="10" width="500" height="405" rx="15" fill="#f6f2fa" stroke="#5d5077" stroke-width="2"/><rect x="10" y="10" width="500" height="84" rx="15" fill="#5d5077" stroke="#5d5077" stroke-width="2"/><rect x="10" y="69" width="500" height="30" rx="0" fill="#5d5077" stroke="#5d5077" stroke-width="0"/><text x="34" y="53" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="700" fill="white">접으면 봉투가 되는 편지지</text><text x="34" y="135" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">한 장에 편지를 쓴 뒤</text><text x="34" y="179" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">선을 따라 접어 보세요.</text><text x="34" y="223" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">봉투를 따로 살 필요가 없습니다.</text><text x="34" y="267" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">풀 없이 붙일 수 있습니다.</text><text x="34" y="311" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">한 묶음: 파란색 5장 + 노란색 5장</text><text x="34" y="355" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#5d5077">가격: 한 묶음 3,000원</text></svg>