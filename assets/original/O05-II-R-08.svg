<svg xmlns="http://www.w3.org/2000/svg" width="560" height="585" viewBox="0 0 560 585"><rect width="560" height="585" rx="24" fill="#fbf3ec"/><rect x="15" y="15" width="530" height="555" rx="16" fill="none" stroke="#724932" stroke-width="3"/><g transform="translate(158,38)"><path d="M76 28H157L144 63H90Z" fill="#e1b08b" stroke="#724932" stroke-width="5"/><rect x="84" y="65" width="72" height="63" rx="9" fill="#f1e0cf" stroke="#724932" stroke-width="5"/><path d="M120 30V17H187L196 27" fill="none" stroke="#724932" stroke-width="5"/><rect x="103" y="87" width="34" height="27" rx="4" fill="#fff" stroke="#724932" stroke-width="3"/><circle cx="122" cy="100" r="4" fill="#724932"/></g><rect x="28" y="184" width="504" height="64" rx="12" fill="#724932"/><text x="280" y="228" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="32" font-weight="700" fill="#fff">원두, 어떻게 내려 드시나요?</text><text x="280" y="295" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#724932">거친 가루부터 고운 가루까지</text><text x="280" y="349" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#724932">쓰시는 추출 도구에 맞춰 갈아 드립니다.</text><text x="280" y="403" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#724932">가지고 계신 원두도 맡길 수 있어요.</text><text x="280" y="457" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#724932">갈지 않은 원두만 가져오세요.</text><text x="280" y="511" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#724932">한알 분쇄소</text></svg>