<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#f0f8f0" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR,sans-serif" font-size="39" fill="#4d6d57" font-weight="700">내 목소리로 읽는 시</text><path d="M 52 132 H 728" fill="none" stroke="#4d6d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#4d6d57" font-weight="400">시 한 편을 현장에서 드립니다.</text><text x="52" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#4d6d57" font-weight="400">같은 시를 두 번 녹음합니다.</text><text x="52" y="325" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#4d6d57" font-weight="400">두 녹음 중 마음에 드는 하나를 고르세요.</text><text x="52" y="390" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#4d6d57" font-weight="400">고른 녹음 파일을 본인에게 보내 드립니다.</text><text x="52" y="455" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#4d6d57" font-weight="400">녹음 중에는 휴대 전화 소리를 꺼 주세요.</text></svg>