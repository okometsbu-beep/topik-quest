<svg xmlns="http://www.w3.org/2000/svg" width="780" height="526" viewBox="0 0 780 526"><rect width="780" height="526" fill="white"/><rect x="24" y="24" width="732" height="478" rx="18" fill="#f6f1fa" stroke="#675784" stroke-width="3"/><text x="53" y="97" font-family="Noto Sans CJK KR,sans-serif" font-size="38" fill="#675784" font-weight="700">빙글빙글 바람개비 만들기</text><path d="M 53 132 H 727" fill="none" stroke="#675784" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="194" font-family="Noto Sans CJK KR,sans-serif" font-size="30" fill="#675784" font-weight="400">일요일 오전 10시~12시 / 공원 작은 마당</text><text x="53" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="30" fill="#675784" font-weight="400">색종이와 막대는 현장에서 드립니다.</text><text x="53" y="326" font-family="Noto Sans CJK KR,sans-serif" font-size="30" fill="#675784" font-weight="400">참가비는 없습니다.</text><text x="53" y="392" font-family="Noto Sans CJK KR,sans-serif" font-size="30" fill="#675784" font-weight="400">한 사람당 바람개비 한 개를 만듭니다.</text><text x="53" y="458" font-family="Noto Sans CJK KR,sans-serif" font-size="30" fill="#675784" font-weight="400">완성한 바람개비는 가져갈 수 있습니다.</text></svg>