<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420"><rect width="520" height="420" fill="white"/><rect x="10" y="10" width="500" height="400" rx="16" fill="#f6f1fb" stroke="#665084" stroke-width="2"/><rect x="10" y="10" width="500" height="83" rx="16" fill="#665084" stroke="#665084" stroke-width="2"/><rect x="10" y="63" width="500" height="30" rx="0" fill="#665084" stroke="#665084" stroke-width="0"/><text x="34" y="51" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="700" fill="#fff">앞뒤가 다른 손수건</text><text x="34" y="130" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">앞면은 꽃무늬, 뒷면은 줄무늬!</text><text x="34" y="173" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">한 장으로 두 가지 무늬를 즐기세요.</text><text x="34" y="216" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">크기: 가로 30cm × 세로 30cm</text><text x="34" y="259" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">한 장 6,000원 / 두 장 10,000원</text><text x="34" y="302" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">색상: 노란색, 초록색</text><text x="34" y="345" font-family="Noto Sans CJK KR, sans-serif" font-size="28" font-weight="400" fill="#665084">상자 포장은 1,000원 추가</text></svg>