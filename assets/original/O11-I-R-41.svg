<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#fbf4e9" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR,sans-serif" font-size="39" fill="#775e38" font-weight="700">꼬마 자동차 운전 체험</text><path d="M 52 132 H 728" fill="none" stroke="#775e38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#775e38" font-weight="400">한 사람씩 운전석에 앉습니다.</text><text x="52" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#775e38" font-weight="400">둥근 체험 길을 두 바퀴 돕니다.</text><text x="52" y="325" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#775e38" font-weight="400">자동차 속도는 직원이 정합니다.</text><text x="52" y="390" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#775e38" font-weight="400">핸들은 참가자가 직접 잡습니다.</text><text x="52" y="455" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#775e38" font-weight="400">직원의 출발 신호를 기다리세요.</text></svg>