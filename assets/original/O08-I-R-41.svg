<svg xmlns="http://www.w3.org/2000/svg" width="780" height="660" viewBox="0 0 780 660"><rect width="780" height="660" fill="white"/><rect x="24" y="24" width="732" height="612" rx="18" fill="#f6f1fa" stroke="#675784" stroke-width="3"/><path d="M 53 135 H 727" fill="none" stroke="#675784" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="98" font-family="Noto Sans CJK KR,sans-serif" font-size="40" fill="#675784" font-weight="700">내 수건에 이름을 새겨요</text><text x="53" y="215" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#675784" font-weight="400">이름은 네 글자까지 가능합니다.</text><text x="53" y="292" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#675784" font-weight="400">실 색은 빨강·파랑·초록 중 고르세요.</text><text x="53" y="369" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#675784" font-weight="400">이름을 새길 수건은</text><text x="53" y="446" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#675784" font-weight="400">직접 가져오세요.</text><text x="53" y="523" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#675784" font-weight="400">오전에 맡기면 그날 오후에 찾아가세요.</text></svg>