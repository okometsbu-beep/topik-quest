<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900"><rect width="720" height="900" fill="#eef5f0"/><rect x="0" y="0" width="18" height="900" fill="#397364"/><text x="49" y="80" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#275c50" font-weight="700">바람은 통하고</text><text x="49" y="140" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#275c50" font-weight="700">작은 벌레는 밖으로</text><g transform="translate(456 202)" fill="none" stroke="#397364" stroke-width="3"><rect width="180" height="180" fill="#fff"/><path d="M90 0V180M0 90H180M0 30H180M0 60H180M0 120H180M0 150H180M30 0V180M60 0V180M120 0V180M150 0V180"/><rect x="-8" y="-8" width="196" height="196" stroke-width="6"/></g><text x="49" y="254" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#243a44" font-weight="400">우리 집 창틀에</text><text x="49" y="308" font-family="Noto Sans CJK KR,sans-serif" font-size="38" fill="#275c50" font-weight="700">꼭 맞게!</text><text x="49" y="457" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="400">방문하여 가로·세로를 잰 뒤</text><text x="49" y="514" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="400">제작합니다.</text><text x="49" y="586" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="400">낡은 망을 떼고 새 망을</text><text x="49" y="643" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="400">단단히 설치합니다.</text><text x="49" y="725" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="400">측정·제작·설치 한 번에 상담하세요.</text><text x="49" y="826" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#29483e" font-weight="700">촘촘 방문 제작소</text></svg>