<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000"><rect width="720" height="1000" fill="#f9f1ed"/><path d="M0 0H18V1000H0Z" fill="#9b5b48"/><text x="50" y="92" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#7e4838" font-weight="700">집에 남은 작은 가족을</text><text x="50" y="150" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#7e4838" font-weight="700">찾아갑니다</text><text x="50" y="253" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">보호자님이 비운 시간에</text><text x="50" y="307" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">방문합니다.</text><text x="50" y="386" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">밥과 물을 채우고</text><text x="50" y="440" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">함께 놀아 줍니다.</text><text x="50" y="519" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">그날의 모습을</text><text x="50" y="573" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">사진으로 보내드립니다.</text><text x="50" y="652" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">낯선 숙소로 옮기지 않아도</text><text x="50" y="706" font-family="Noto Sans CJK KR,sans-serif" font-size="35" fill="#253c46" font-weight="400">괜찮아요.</text><g transform="translate(440 782)" fill="none" stroke="#9b5b48" stroke-width="5"><path d="M0 55L72 0L144 55V150H0Z" fill="#f0dcd4"/><path d="M48 150V92H94V150"/><circle cx="39" cy="50" r="9"/><circle cx="103" cy="50" r="9"/></g><text x="50" y="922" font-family="Noto Sans CJK KR,sans-serif" font-size="38" fill="#7e4838" font-weight="700">곁에 방문 돌봄</text></svg>