<svg xmlns="http://www.w3.org/2000/svg" width="720" height="800" viewBox="0 0 720 800"><rect width="720" height="800" rx="22" fill="#eef6ed"/><rect x="22" y="22" width="676" height="756" rx="14" fill="white" stroke="#356642" stroke-width="2"/><rect x="42" y="42" width="10" height="100" rx="5" fill="#356642"/><text x="70" y="93" font-family="Noto Sans CJK KR, sans-serif" font-size="40" font-weight="700" fill="#356642">흙을 들추지 않아도 보여요</text><text x="70" y="211" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">투명한 옆 창으로</text><text x="70" y="269" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">속 물통의 눈금을 확인하세요.</text><text x="70" y="327" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">물이 줄면 작은 입구로</text><text x="70" y="385" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">보충하면 됩니다.</text><text x="70" y="443" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">책상 위 초록 친구를 위한</text><text x="70" y="501" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">두 겹 화분</text><text x="70" y="559" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#26333c">맑은창 시리즈</text><g transform="translate(490 620)" stroke="#356642" stroke-width="4" fill="none"><path d="M0 15 H130 L110 130 H20 Z" fill="#e7f0e3"/><path d="M45 125 V60 H85 V125 M47 95 H84 M47 111 H84"/><path d="M65 15 V-37 M65-10 Q20-50 30-68 Q71-60 65-10 M65-8 Q110-45 116-61 Q74-61 65-8"/></g></svg>