<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#eef7fa" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR,sans-serif" font-size="39" fill="#305d72" font-weight="700">얼음 동물 전시</text><path d="M 52 132 H 728" fill="none" stroke="#305d72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">얼음으로 만든 동물들을 실내에서 만나 보세요.</text><text x="52" y="260" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">전시실이 추우니 겉옷을 준비하세요.</text><text x="52" y="325" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">작품을 손으로 만지지 마세요.</text><text x="52" y="390" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">사진 촬영은 가능합니다.</text><text x="52" y="455" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#305d72" font-weight="400">입장권 한 장으로 한 번만 들어갈 수 있습니다.</text></svg>