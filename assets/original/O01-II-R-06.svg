<svg xmlns="http://www.w3.org/2000/svg" width="840" height="336" viewBox="0 0 840 336"><rect width="840" height="336" fill="#fffdf7"/><rect x="18" y="18" width="804" height="300" rx="12" fill="none" stroke="#3d6454" stroke-width="3"/><rect x="18" y="18" width="804" height="88" rx="10" fill="#3d6454"/><text x="420" y="74" text-anchor="middle" fill="white" font-family="Noto Sans CJK KR,sans-serif" font-weight="700" font-size="34">문 앞 한 걸음, 함께 비워요</text><text x="55" y="154" fill="#172b38" font-family="Noto Sans CJK KR,sans-serif" font-size="27">통로에 잠깐 놓은 상자도</text><text x="55" y="206" fill="#172b38" font-family="Noto Sans CJK KR,sans-serif" font-size="27">휠체어와 유모차에는 큰 벽이 됩니다.</text><text x="55" y="258" fill="#172b38" font-family="Noto Sans CJK KR,sans-serif" font-size="27">출입구 앞은 언제나 지나갈 수 있게!</text><text x="420" y="299" text-anchor="middle" fill="#3d6454" font-family="Noto Sans CJK KR,sans-serif" font-size="22">모두를 위한 통로 지키기</text></svg>