<svg xmlns="http://www.w3.org/2000/svg" width="780" height="660" viewBox="0 0 780 660"><rect width="780" height="660" fill="white"/><rect x="24" y="24" width="732" height="612" rx="18" fill="#eef8fa" stroke="#315f73" stroke-width="3"/><path d="M 53 135 H 727" fill="none" stroke="#315f73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="53" y="98" font-family="Noto Sans CJK KR,sans-serif" font-size="40" fill="#315f73" font-weight="700">지폐를 동전으로 바꾸세요</text><text x="53" y="215" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#315f73" font-weight="400">천 원 지폐 한 장 → 백 원 동전 열 개</text><text x="53" y="292" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#315f73" font-weight="400">수수료는 없습니다.</text><text x="53" y="369" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#315f73" font-weight="400">동전은 넣지 마세요.</text><text x="53" y="446" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#315f73" font-weight="400">동전이 나오지 않으면</text><text x="53" y="523" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#315f73" font-weight="400">직원에게 알려 주세요.</text></svg>