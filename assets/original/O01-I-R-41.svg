<svg xmlns="http://www.w3.org/2000/svg" width="760" height="536" viewBox="0 0 760 536"><rect width="760" height="536" fill="#ffffff"/><rect x="18" y="18" width="724" height="500" rx="18" fill="#fff4e4" stroke="#743b20" stroke-width="3"/><rect x="18" y="18" width="724" height="118" rx="18" fill="#743b20" stroke="#743b20" stroke-width="3"/><rect x="18" y="95" width="724" height="41" rx="0" fill="#743b20" stroke="#743b20" stroke-width="0"/><text x="52" y="94" font-family="Noto Sans CJK KR, sans-serif" font-size="42" font-weight="700" fill="#fff">사진으로 만드는 달력</text><text x="52" y="190" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">좋아하는 사진 한 장으로</text><text x="52" y="241" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">달력을 만들어 드립니다.</text><text x="52" y="292" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">사진은 이메일로 보내 주세요.</text><text x="52" y="343" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">달력 크기: 가로 20cm × 세로 30cm</text><text x="52" y="394" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">제작 기간: 주문 후 3일</text><text x="52" y="445" font-family="Noto Sans CJK KR, sans-serif" font-size="29" font-weight="400" fill="#743b20">완성된 달력은 가게에서 받아 가세요.</text><line x1="52" y1="471" x2="708" y2="471" stroke="#743b20" stroke-width="1" stroke-linecap="round"/></svg>