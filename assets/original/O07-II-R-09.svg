<svg xmlns="http://www.w3.org/2000/svg" width="560" height="739" viewBox="0 0 560 739"><rect width="560" height="739" rx="18" fill="#eff7fa"/><rect x="15" y="15" width="530" height="709" rx="12" fill="#fff" stroke="#386572" stroke-width="3"/><rect x="31" y="34" width="9" height="48" rx="4" fill="#386572"/><text x="280" y="69" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="34" font-weight="700" fill="#386572">물빛 종이 작업실</text><g transform="translate(151,98)"><path d="M25 194H230L218 227H40Z" fill="#a8d0d8" stroke="#386572" stroke-width="5"/><path d="M39 47H216V184H39Z" fill="#fff4d7" stroke="#386572" stroke-width="5"/><path d="M41 88Q81 48 126 88T214 88M41 135Q81 95 126 135T214 135M41 180Q81 140 126 180T214 180" fill="none" stroke="#8fb4d6" stroke-width="13"/><path d="M72 26V59M180 26V59" stroke="#986f45" stroke-width="12" stroke-linecap="round"/></g><text x="280" y="383" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">토요일 오후 1시부터 4시까지</text><text x="280" y="431" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">접수: 당일 작업실 입구에서만</text><text x="280" y="479" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">무늬: 준비된 세 가지 중 한 가지 선택</text><text x="280" y="527" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">재료: 작업실에서 모두 제공</text><text x="280" y="575" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">작품: 말리는 시간이 필요하므로</text><text x="280" y="623" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">다음 날 오후 2시부터 직접 수령</text><text x="280" y="671" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#386572">택배 발송은 하지 않습니다.</text></svg>