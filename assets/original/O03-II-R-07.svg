<svg xmlns="http://www.w3.org/2000/svg" width="720" height="870" viewBox="0 0 720 870"><rect width="720" height="870" rx="20" fill="#fbf4e9"/><rect x="30" y="30" width="660" height="810" rx="16" fill="none" stroke="#8d633d" stroke-width="3"/><text x="62" y="100" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#704921" font-weight="700">서랍 속 한 장면,</text><text x="62" y="158" font-family="Noto Sans CJK KR,sans-serif" font-size="42" fill="#704921" font-weight="700">화면 속으로</text><g transform="translate(65 215)" fill="none" stroke="#8d633d" stroke-width="5"><rect width="250" height="120" fill="#eee0cd"/><path d="M0 22H250M0 98H250M30 0V22M70 0V22M110 0V22M150 0V22M190 0V22M230 0V22M30 98V120M70 98V120M110 98V120M150 98V120M190 98V120M230 98V120"/><path d="M285 60H353M337 45L353 60L337 75"/><rect x="390" y="0" width="150" height="110" rx="6" fill="#fff"/><path d="M420 135H510M465 110V135"/></g><text x="62" y="421" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#433b31" font-weight="400">현상된 필름을 맡겨 주세요.</text><text x="62" y="479" font-family="Noto Sans CJK KR,sans-serif" font-size="31" fill="#433b31" font-weight="400">사진 한 장씩 파일로 바꾸어 드립니다.</text><text x="62" y="537" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#433b31" font-weight="400">휴대 전화와 컴퓨터에서</text><text x="62" y="595" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#433b31" font-weight="400">다시 감상하세요.</text><text x="62" y="680" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#433b31" font-weight="400">원본 필름도 돌려드립니다.</text><text x="62" y="787" font-family="Noto Sans CJK KR,sans-serif" font-size="34" fill="#433b31" font-weight="700">오래빛 디지털 작업실</text></svg>