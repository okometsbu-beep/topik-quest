<svg xmlns="http://www.w3.org/2000/svg" width="720" height="652" viewBox="0 0 720 652"><rect width="720" height="652" fill="#f6f0df"/><rect x="24" y="24" width="672" height="604" rx="14" fill="#fffefb"/><rect x="24" y="24" width="16" height="604" rx="6" fill="#726034"/><text x="370" y="83" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="42" font-weight="700" fill="#726034">아직 쓸 수 있는 연필인데</text><g transform="translate(180,116)"><g transform="rotate(-18 180 120)"><path d="M38 96H165V144H38L10 120Z" fill="#edca75" stroke="#3a5361" stroke-width="5"/><path d="M10 120L27 109V131Z" fill="#3a5361"/><path d="M38 112H161M38 130H161" stroke="#b78c36" stroke-width="3"/><rect x="155" y="86" width="190" height="68" rx="15" fill="#a8c4d1" stroke="#3a5361" stroke-width="5"/><path d="M177 87V153M190 88V152" stroke="#3a5361" stroke-width="4"/></g><path d="M85 202H300" stroke="#9aaeb7" stroke-width="3"/></g><text x="370" y="396" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">너무 짧아 잡기 힘든가요?</text><text x="370" y="450" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">연필 뒤쪽을 끼우고 조이면</text><text x="370" y="504" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">긴 손잡이가 됩니다.</text><text x="370" y="558" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="36" fill="#273e49">남은 연필도 편하게 잡아 보세요.</text></svg>