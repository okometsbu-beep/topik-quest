<svg xmlns="http://www.w3.org/2000/svg" width="720" height="769" viewBox="0 0 720 769"><rect width="720" height="769" fill="#f4f0e6"/><rect x="17" y="17" width="686" height="735" rx="14" fill="#fffdf7" stroke="#47665d" stroke-width="3"/><text x="360" y="77" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="42" font-weight="700" fill="#274e45">그림자 인형 꾸러미 대여</text><g transform="translate(115,113)"><rect x="70" y="-3" width="330" height="215" rx="5" fill="#fff3d3" stroke="#8e7952" stroke-width="5"/><path d="M70 212V238M400 212V238" stroke="#8e7952" stroke-width="7"/><path d="M187 114L182 63L207 86L228 58L235 110Q262 119 249 148L273 171H160L179 148Q162 125 187 114Z" fill="#52626a"/><path d="M213 169V236" stroke="#52626a" stroke-width="7"/><path d="M291 104L314 91L331 112L326 135L305 145L289 131Z" fill="#52626a"/><path d="M310 143V236" stroke="#52626a" stroke-width="7"/></g><text x="360" y="393" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">막대 인형 6개와 흰 천 1장을 빌려</text><text x="360" y="449" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">드립니다.</text><text x="360" y="505" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">빛을 비출 조명은 직접 준비해 주세요.</text><text x="360" y="561" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">대여 기간: 받은 날부터 사흘</text><text x="360" y="617" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">꾸러미는 안내실에서 직접 받아 가세요.</text><text x="360" y="673" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="38" fill="#28473f">이용 후 인형과 천을 함께 돌려주세요.</text></svg>