<svg xmlns="http://www.w3.org/2000/svg" width="560" height="585" viewBox="0 0 560 585"><rect width="560" height="585" rx="24" fill="#fff6eb"/><rect x="15" y="15" width="530" height="555" rx="16" fill="none" stroke="#8f5730" stroke-width="3"/><g transform="translate(158,38)"><ellipse cx="120" cy="78" rx="57" ry="43" fill="#fff" stroke="#8f5730" stroke-width="5"/><ellipse cx="120" cy="78" rx="36" ry="25" fill="#f4d5ae"/><path d="M40 35V115M28 35V60H52V35M199 35V115M189 35V73H199" fill="none" stroke="#8f5730" stroke-width="5"/><path d="M106 74Q109 56 121 59Q140 63 121 78V86" fill="none" stroke="#8f5730" stroke-width="6"/><circle cx="121" cy="98" r="3.5" fill="#8f5730"/></g><rect x="28" y="184" width="504" height="64" rx="12" fill="#8f5730"/><text x="280" y="228" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="32" font-weight="700" fill="#fff">주문하기 전에 알려 주세요</text><text x="280" y="295" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#8f5730">먹을 수 없는 재료가 있나요?</text><text x="280" y="349" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#8f5730">메뉴 이름만 보고 고르지 마세요.</text><text x="280" y="403" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#8f5730">들어가는 재료를 직원에게 물어보고</text><text x="280" y="457" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#8f5730">피해야 할 재료를 미리 알려 주세요.</text><text x="280" y="511" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#8f5730">한 번 더 확인하는 식사</text></svg>