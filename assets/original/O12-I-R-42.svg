<svg xmlns="http://www.w3.org/2000/svg" width="780" height="521" viewBox="0 0 780 521"><rect width="780" height="521" fill="white"/><rect x="24" y="24" width="732" height="473" rx="18" fill="#f0f8f0" stroke="#304655" stroke-width="3"/><text x="52" y="95" font-family="Noto Sans CJK KR, sans-serif" font-size="39" font-weight="700" fill="#4d6d57">글자 목걸이 만들기</text><path d="M 52 132 H 728" fill="none" stroke="#4d6d57" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="52" y="195" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#4d6d57">글자 조각을 골라 끈에 끼웁니다.</text><text x="52" y="260" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#4d6d57">한 목걸이에 글자는 여섯 개까지 넣습니다.</text><text x="52" y="325" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#4d6d57">같은 글자를 여러 번 써도 됩니다.</text><text x="52" y="390" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#4d6d57">글자 사이의 빈칸은 개수에 넣지 않습니다.</text><text x="52" y="455" font-family="Noto Sans CJK KR, sans-serif" font-size="34" font-weight="400" fill="#4d6d57">완성한 목걸이는 가져갈 수 있습니다.</text></svg>