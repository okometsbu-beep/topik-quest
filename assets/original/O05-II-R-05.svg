<svg xmlns="http://www.w3.org/2000/svg" width="560" height="585" viewBox="0 0 560 585"><rect width="560" height="585" rx="24" fill="#eff6f2"/><rect x="15" y="15" width="530" height="555" rx="16" fill="none" stroke="#234c3b" stroke-width="3"/><g transform="translate(158,38)"><path d="M80 112V28H164V112" fill="#dbece5" stroke="#234c3b" stroke-width="5"/><path d="M90 107L150 45V112Z" fill="#7da994" stroke="#234c3b" stroke-width="4"/><circle cx="132" cy="88" r="4" fill="#fff"/><path d="M150 112L174 112L164 126L142 126Z" fill="#d29454"/><path d="M54 129H190" stroke="#234c3b" stroke-width="5"/></g><rect x="28" y="184" width="504" height="64" rx="12" fill="#234c3b"/><text x="280" y="228" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="32" font-weight="700" fill="#fff">문은 잠시 그 자리에</text><text x="280" y="295" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#234c3b">짐을 옮길 때 문이 자꾸 닫히나요?</text><text x="280" y="349" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#234c3b">발로 받침을 내리면 열린 문이 멈춥니다.</text><text x="280" y="403" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#234c3b">다시 누르면 받침이 올라갑니다.</text><text x="280" y="457" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#234c3b">손을 쓰지 않아도 간편하게!</text><text x="280" y="511" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" fill="#234c3b">발끝 문 받침</text></svg>