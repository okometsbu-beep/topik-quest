<svg xmlns="http://www.w3.org/2000/svg" width="560" height="667" viewBox="0 0 560 667"><rect width="560" height="667" rx="24" fill="#fbf3eb"/><rect x="15" y="15" width="530" height="637" rx="15" fill="none" stroke="#614735" stroke-width="3"/><g transform="translate(152,35)"><path d="M101 31V17H158V31" fill="none" stroke="#614735" stroke-width="6"/><rect x="70" y="34" width="119" height="112" rx="18" fill="#eac6a3" stroke="#614735" stroke-width="5"/><path d="M94 54V125M165 54V125" stroke="#b78a63" stroke-width="5"/><circle cx="88" cy="158" r="12" fill="#fff" stroke="#614735" stroke-width="5"/><circle cx="173" cy="158" r="12" fill="#fff" stroke="#614735" stroke-width="5"/><path d="M216 132L225 141L212 154L203 145Z" fill="#8d9eaa" stroke="#40535f" stroke-width="3"/><path d="M204 145L192 157" stroke="#40535f" stroke-width="5"/></g><rect x="28" y="229" width="504" height="73" rx="11" fill="#614735"/><text x="280" y="271" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="34" font-weight="700" fill="#fff">가방은 아직 튼튼한데 바퀴만?</text><text x="280" y="359" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">몸체는 그대로, 바퀴는 새 부품으로!</text><text x="280" y="408" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">가방에 맞는 부품을 확인한 뒤 바꿔</text><text x="280" y="457" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">드립니다.</text><text x="280" y="506" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">손상된 바퀴와 가방 사진을 먼저 보내</text><text x="280" y="555" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">주세요.</text><text x="280" y="604" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#614735">다시굴러 여행가방 수선실</text></svg>