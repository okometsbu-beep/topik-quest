<svg xmlns="http://www.w3.org/2000/svg" width="560" height="691" viewBox="0 0 560 691"><rect width="560" height="691" rx="18" fill="#f7f5ee"/><rect x="15" y="15" width="530" height="661" rx="12" fill="#fff" stroke="#5d6250" stroke-width="3"/><rect x="31" y="34" width="9" height="48" rx="4" fill="#5d6250"/><text x="280" y="69" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="34" font-weight="700" fill="#5d6250">오늘의 향을 그대로</text><g transform="translate(151,98)"><rect x="22" y="102" width="53" height="73" rx="10" fill="#e4c8ad" stroke="#69554a" stroke-width="4"/><rect x="35" y="82" width="27" height="22" fill="#69554a"/><rect x="101" y="102" width="53" height="73" rx="10" fill="#c8d8b7" stroke="#48624d" stroke-width="4"/><rect x="114" y="82" width="27" height="22" fill="#48624d"/><rect x="181" y="102" width="53" height="73" rx="10" fill="#d5c7e7" stroke="#685379" stroke-width="4"/><rect x="194" y="82" width="27" height="22" fill="#685379"/><path d="M45 65C29 49 64 42 48 24M126 65C110 49 145 42 129 24M206 65C190 49 225 42 209 24" fill="none" stroke="#8b8378" stroke-width="4"/><path d="M19 192H238" stroke="#8b8378" stroke-width="4"/></g><text x="280" y="383" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">향 비교 체험실에 오실 때에는</text><text x="280" y="431" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">향수와 향이 강한 화장품을 삼가</text><text x="280" y="479" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">주세요.</text><text x="280" y="527" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">개인의 향이 체험 시료와 섞이면</text><text x="280" y="575" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">서로 다른 향을 구별하기 어렵습니다.</text><text x="280" y="623" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="31" fill="#5d6250">맑은향 체험실</text></svg>